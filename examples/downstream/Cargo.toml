[package]
name = "capntproto-preview-example"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]
resolver = "2"

[features]
default = ["storage", "services", "tls"]
storage = ["capntproto/storage"]
services = ["capntproto/services"]
tls = ["capntproto/tls"]

[dependencies]
capntproto = { path = "../..", default-features = false }
tokio = { version = "1", features = ["rt", "macros", "io-util"] }
tempfile = "3"

[build-dependencies]
capnpc = { package = "capntproto-codegen", path = "../../crates/capntproto-codegen" }
