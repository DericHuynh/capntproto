[package]
name = "capntproto-preview-example"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]
resolver = "2"

[features]
default = ["native", "storage", "services", "tls", "quic"]
native = ["capntproto/native"]
storage = ["capntproto/storage"]
services = ["capntproto/services"]
tls = ["capntproto/tls"]
quic = ["capntproto/quic"]

[dependencies]
capntproto = { path = "../..", default-features = false }
capnp = { package = "capntproto-core", path = "../../crates/capntproto-core" }
capnp-rpc = { package = "capntproto-rpc", path = "../../crates/capntproto-rpc" }
tokio = { version = "1", features = ["rt", "macros", "io-util"] }
tempfile = "3"

[build-dependencies]
capnpc = { package = "capntproto-codegen", path = "../../crates/capntproto-codegen" }
