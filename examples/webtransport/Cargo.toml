[package]
name = "capntproto-webtransport-example"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[features]
default = ["native"]
native = []
browser = []
monoio = ["native", "capntproto/monoio"]

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "server"
required-features = ["native"]
[[bin]]
name = "client"
required-features = ["native"]

[dependencies]
service = { package="capntproto-example-service", path="../service" }
capntproto = { path = "../..", default-features = false, features = ["webtransport"] }
futures = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
capntproto = { path = "../..", default-features = false, features = ["tls"] }
tokio = { version = "1", features = ["rt", "macros", "net", "time", "signal"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[[bin]]
name = "monoio-client"
required-features = ["monoio"]

[[bin]]
name = "monoio-server"
required-features = ["monoio"]
