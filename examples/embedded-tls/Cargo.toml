[package]
name = "capntproto-embedded-example"
version = "0.1.0"
edition = "2021"
publish = false
autobins = false
[workspace]
[features]
default = []
host = ["dep:capntproto", "dep:tokio", "dep:rand", "dep:rcgen"]
embassy-net = ["capntproto-transport/embassy-net"]
[[bin]]
name = "telemetry-server"
path = "src/bin/server.rs"
required-features = ["host"]
[[bin]]
name = "telemetry-client"
path = "src/bin/client.rs"
required-features = ["host"]
[[test]]
name = "tls"
required-features = ["host"]
[dependencies]
capnp = { package = "capntproto-core", path = "../../crates/capntproto-core", default-features = false }
capntproto-transport = { path = "../../crates/capntproto-transport", default-features = false, features = ["embassy"] }
rand_core = { version = "0.6", default-features = false }
capntproto = { path = "../..", default-features = false, features = ["tls"], optional = true }
tokio = { version = "1", features = ["rt", "macros", "net", "time", "io-util"], optional = true }
rand = { version = "0.8", optional = true }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"], optional = true }
[build-dependencies]
capnpc = { package = "capntproto-codegen", path = "../../crates/capntproto-codegen" }
[dev-dependencies]
allocation-counter = "=0.8.1"
