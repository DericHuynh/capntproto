[package]
name = "capntproto-test-support"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
capnp = { package = "capntproto-core", version = "0.25", path = "../crates/capntproto-core" }
capnp-rpc = { package = "capntproto-rpc", path = "../crates/capntproto-rpc" }
flate2 = "1"
fs2 = "0.4"
ring = "0.17"
tempfile = "3"
tar = "0.4"
shuttle = "=0.9.4"
signal-hook = "0.4.4"

[build-dependencies]
capnpc = { package = "capntproto-codegen", version = "0.25", path = "../crates/capntproto-codegen" }
capntproto-compiler = { path = "../crates/capntproto-compiler" }
capnp = { package = "capntproto-core", version = "0.25", path = "../crates/capntproto-core" }
