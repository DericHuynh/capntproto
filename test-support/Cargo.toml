[package]
name = "reproto-test-support"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
capnp = { version = "0.25", path = "../vendor/capnp" }
capnp-rpc = { path = "../vendor/capnp-rpc" }
flate2 = "1"
fs2 = "0.4"
ring = "0.17"
tempfile = "3"
tar = "0.4"
shuttle = "=0.9.4"
signal-hook = "0.3.18"

[build-dependencies]
capnpc = { version = "0.25", path = "../vendor/capnpc" }
capnp-compiler = { path = "../crates/capnp-compiler" }
capnp = { version = "0.25", path = "../vendor/capnp" }
