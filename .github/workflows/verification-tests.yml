name: Verification / Cargo tests
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '19 3 * * 1'
permissions:
  contents: read
concurrency:
  group: cargo-verification-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  RUST_BACKTRACE: '1'
jobs:
  tests:
    name: Workspace tests and doctests
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # Use the source from checkout; actionlint 1.7.12 does not support $/ syntax.
      - uses: ./.github/actions/quality-setup # zizmor: ignore[self-repository]
        with:
          lane: cargo
      - name: Run ordinary Cargo partition without coverage instrumentation
        env:
          TLA2TOOLS_JAR: ${{ runner.temp }}/tla2tools.jar
        run: cargo run --locked -p capntproto-quality -- cargo target/quality/cargo
      - name: Advisory checks
        if: success() || failure()
        run: cargo run --locked -p capntproto-quality -- security target/quality/security
      - name: Upload independent C++ and Rust interoperability matrix
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: upstream-rpc-interoperability
          path: |
            target/verification/upstream-interop/README.md
            target/verification/upstream-interop/matrix.json
            target/verification/upstream-interop/**/*.log
          if-no-files-found: warn
          retention-days: 30
      - name: Export compact README data (including failed test runs)
        if: success() || failure()
        run: cargo run --locked -p capntproto-dev -- reports collect --input target/quality --kind cargo --output target/readme-data/publication.json --failures-output target/quality/FAILED-TESTS.md --report-output target/quality/cargo-tests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: readme-data-cargo-${{ github.run_attempt }}
          path: target/readme-data/publication.json
          if-no-files-found: warn
          retention-days: 90
      - id: report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: cargo-test-report
          overwrite: true
          path: target/quality/
          if-no-files-found: error
          retention-days: 30
      - name: Job summary
        if: always()
        env:
          REPORT_URL: ${{ steps.report.outputs.artifact-url }}
        run: |
          printf '\n[Show all failed tests and diagnostics (FAILED-TESTS.md in report artifact)](%s)\n' "$REPORT_URL" >> "$GITHUB_STEP_SUMMARY"
          if test -f target/quality/FAILED-TESTS.md; then
            cat target/quality/FAILED-TESTS.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -f target/quality/cargo-tests/README.md; then
            cat target/quality/cargo-tests/README.md >> "$GITHUB_STEP_SUMMARY"
          fi
