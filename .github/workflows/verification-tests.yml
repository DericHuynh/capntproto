name: Verification / Cargo tests
on:
  workflow_dispatch:
  schedule:
    - cron: '19 3 * * 1'
permissions:
  contents: read
concurrency:
  group: cargo-verification-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  RUST_BACKTRACE: '1'
jobs:
  coverage:
    name: Cargo tests and first-party coverage
    runs-on: ubuntu-26.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # Use the source from checkout; actionlint 1.7.12 does not support $/ syntax.
      - uses: ./.github/actions/quality-setup # zizmor: ignore[self-repository]
        with:
          lane: coverage
      - name: Run Cargo partition once with LLVM coverage
        env:
          TLA2TOOLS_JAR: ${{ runner.temp }}/tla2tools.jar
        run: cargo run --locked -p capntproto-quality -- coverage target/quality/coverage
      - name: Advisory checks
        if: success() || failure()
        run: cargo run --locked -p capntproto-quality -- security target/quality/security
      - name: Validate counters and generate README with comparison bar charts
        if: success() || failure()
        run: cargo run --locked -p capntproto-quality -- report target/quality coverage,security
      - name: Export compact README data (including failed test runs)
        if: success() || failure()
        run: python3 scripts/update_readme.py collect --input target/quality --kind cargo --output target/readme-data/publication.json --failures-output target/quality/FAILED-TESTS.md --report-output target/quality/cargo-tests
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: readme-data
          path: target/readme-data/publication.json
          if-no-files-found: warn
          overwrite: true
          retention-days: 90
      - id: report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: cargo-test-report
          path: target/quality/
          if-no-files-found: error
          retention-days: 30
      - name: Job summary
        if: always()
        env:
          REPORT_URL: ${{ steps.report.outputs.artifact-url }}
        run: |
          printf '\n[Show all failed tests and diagnostics (FAILED-TESTS.md in report artifact)](%s)\n' "$REPORT_URL" >> "$GITHUB_STEP_SUMMARY"
          if test -f target/quality/FAILED-TESTS.md; then
            cat target/quality/FAILED-TESTS.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -f target/quality/README.md; then
            sed '/^## Comparison bar charts/,$d' target/quality/README.md >> "$GITHUB_STEP_SUMMARY"
            printf '\n## Comparison bar charts\n\n[Download the README, SVG chart suite and plotted values](%s).\n' "$REPORT_URL" >> "$GITHUB_STEP_SUMMARY"
          fi
