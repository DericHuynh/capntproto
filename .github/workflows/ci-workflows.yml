name: CI / Workflow validation
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-workflow-validation-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Validate workflow configuration and scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/dev-setup # zizmor: ignore[self-repository]
        with:
          cache-key: ci-workflows
      - name: Install script linters and pinned actionlint
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y shellcheck
          curl --fail --location --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
      - name: Check workflow expressions and embedded scripts
        run: '"$RUNNER_TEMP/actionlint" -config-file .github/actionlint.yaml .github/workflows/*.yml'
      - name: Prevent duplicate automatic workflow runs
        run: cargo run --locked -p capntproto-dev -- check-workflows
      - name: Test development tools and reporting safeguards
        run: cargo run --locked -p capntproto-dev -- nextest cargo -- --locked -p capntproto-dev
      - name: Check development tool formatting and diagnostics
        run: |
          cargo fmt --check -p capntproto-dev
          cargo clippy --locked -p capntproto-dev --all-targets -- -D warnings
      - name: Check auditable build scripts
        run: |
          shellcheck scripts/setup-auditable.sh scripts/auditable-cargo.sh scripts/auditable-bench-rustc.sh scripts/test-auditable-cargo.sh
          bash scripts/test-auditable-cargo.sh
      - name: Check workflow security
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: v1.30.1
          # Vendored upstream workflows are source data, not this repo's CI.
          inputs: .github
          advanced-security: false
