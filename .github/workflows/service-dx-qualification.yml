name: Qualify batched subscription lifecycle fixes
on:
  push:
    branches: [codex/service-dx-qualification-20261026]
permissions:
  contents: read
concurrency:
  group: qualify-service-dx-release
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: never
      BUG_BASELINE: 3e9c31f719d33b013b367fefdf9c476f90b89e4d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: 96a329b81127efa5d61be0699d5e7187cf084384
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cmake ninja-build clang-22 libclang-22-dev pkg-config
          rustup toolchain install 1.97.0 --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: release-packages
          cache-on-failure: true
      - name: Prove all three regressions against the previous implementation
        run: |
          git fetch --no-tags --depth=1 origin "$BUG_BASELINE"
          cp src/orm.rs "$RUNNER_TEMP/orm-fixed.rs"
          trap 'cp "$RUNNER_TEMP/orm-fixed.rs" src/orm.rs' EXIT
          git show "$BUG_BASELINE:src/orm.rs" > src/orm.rs
          status=0
          cargo test --locked --no-default-features --features storage --test subscriptions > "$RUNNER_TEMP/subscriptions-before.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/subscriptions-before.log"
          test "$status" -eq 101
          grep -F 'test result: FAILED. 0 passed; 3 failed' "$RUNNER_TEMP/subscriptions-before.log"
          grep -F 'subscription missed a store publication' "$RUNNER_TEMP/subscriptions-before.log"
          grep -F 'revocation left the observer retained' "$RUNNER_TEMP/subscriptions-before.log"
          grep -F 'finished subscription kept its admission slot' "$RUNNER_TEMP/subscriptions-before.log"
      - name: Verify storage-only behavior and adjacent APIs
        run: |
          cargo test --locked --no-default-features --features storage --test subscriptions --test history --test component_orm --test persistence_types
          cargo test --locked --no-default-features --features storage --lib storage::
      - name: Verify default features and encrypted RPC
        run: |
          cargo test --locked --features quic --test subscriptions --test history --test persistence --test durable_bulk --test rpc --test secure_rpc --test service_examples --test tcp_rpc --test rpc_ownership
          cargo clippy --locked -p capntproto --features quic --lib --test subscriptions -- -D warnings
      - name: Verify formatting and public documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo fmt --all -- --check
          cargo doc --locked -p capntproto --no-default-features --no-deps --lib
          cargo doc --locked -p capntproto --no-deps --lib
          cargo doc --locked -p capntproto --features quic --no-deps --lib
      - name: Prepare the package workspace
        run: |
          mkdir "$RUNNER_TEMP/package-source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/package-source"
          sed -i 's/"crates\/\*"\]/"crates\/*", "vendor\/rustls"\]/; /    "vendor\/rustls",/d' "$RUNNER_TEMP/package-source/Cargo.toml"
          cd "$RUNNER_TEMP/package-source"
          cargo update --workspace
      - name: Verify all release packages
        run: |
          cd "$RUNNER_TEMP/package-source"
          cargo package --locked -p capntproto-core -p capntproto-rpc-engine -p capntproto-codegen -p capntproto-compiler -p capntproto-rpc-wire -p capntproto-futures -p capntproto-rpc -p capntproto-compat -p capntproto-rustls -p capntproto
