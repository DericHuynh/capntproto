name: Summarize portable runtime qualification
on:
  push:
    branches: [codex/service-dx-qualification-20261026]
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: DericHuynh/capntproto
    steps:
      - name: Verify the measured source
        run: |
          test "$(gh api repos/$GH_REPO/actions/runs/40621904041 --jq .head_sha)" = 53df5ddc0ef5f96385afb4535df530f876997ce9
          test "$(gh api repos/$GH_REPO/actions/runs/40621904041 --jq .conclusion)" = success
      - name: Download validated analysis
        run: gh run download 40621904041 --name encrypted-benchmark-analysis --dir "$RUNNER_TEMP/analysis"
      - name: Compare latency and exclusive CPU attribution
        run: |
          python3 - <<'PY'
          import collections, json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'analysis'
          summary=json.loads((root/'summary.json').read_text())
          assert summary['measurement_outcome']=='success',summary['measurement_outcome']
          print('AGGREGATE',json.dumps(summary['aggregate'],sort_keys=True))
          print('HOST_COUNTERS',json.dumps(summary.get('host_counters',{}),sort_keys=True))
          for row in summary['latency']:
              print('LATENCY',json.dumps(dict(transport=row['transport'],case=row['case']['name'],min_us={v:round(c['min_ns']/1000,3) for v,c in row['variants'].items()}),sort_keys=True))
          by_profile={(r['mode'],r['transport'],r['case'],r['variant']):r['per_operation'] for r in summary['profiles']}
          for (mode,transport,case,variant),counts in by_profile.items():
              if variant!='portable':continue
              metrics=[m for m in ['Ir','Bcm','Bim','blocks','bytes'] if m in counts]
              changes={}
              for base in ['portable-baseline','legacy','cpp']:
                  other=by_profile.get((mode,transport,case,base))
                  if other is not None:
                      changes[base]={m:round(100*(counts[m]/other[m]-1),4) if other.get(m) else None for m in metrics}
              print('PROFILE',json.dumps(dict(mode=mode,transport=transport,case=case,counts={m:round(counts[m],4) for m in metrics},change_percent=changes),sort_keys=True))
          traces={(r['iterations'],r['transport'],r['case'],r['variant']):r['counts'] for r in summary.get('traces',[])}
          for (n,transport,case,variant),counts in traces.items():
              if n!=100:continue
              short=traces[(10,transport,case,variant)]
              marginal={k:round((v['mean']-short.get(k,{}).get('mean',0))/90,5) for k,v in counts.items()}
              print('IO',json.dumps(dict(transport=transport,case=case,variant=variant,per_operation=marginal),sort_keys=True))
          attribution=json.loads((root/'attribution.json').read_text())
          costs=collections.defaultdict(lambda:collections.defaultdict(collections.Counter))
          for row in attribution['marginal']:
              key=(row['transport'],row['case'],row['variant'])
              for function,counts in row['functions'].items():
                  costs[key][function.split(':',1)[-1]].update(counts)
          for transport in ['tls','quic']:
              for case in ['pipelined-read','concurrent-32','services-4-deep-16-clients-8']:
                  current=costs.get((transport,case,'portable'),{})
                  baseline=costs.get((transport,case,'portable-baseline'),{})
                  if not current:continue
                  deltas=[(name,{m:current.get(name,{}).get(m,0)-baseline.get(name,{}).get(m,0) for m in ['Ir','Bcm']}) for name in current.keys()|baseline.keys()]
                  deltas.sort(key=lambda item:item[1]['Ir'],reverse=True)
                  selected=deltas[:8]+deltas[-8:]
                  print('ATTRIBUTION',json.dumps(dict(transport=transport,case=case,delta_vs='portable-baseline',functions=[dict(function=name[:240],**{m:round(n,4) for m,n in counts.items()}) for name,counts in selected]),sort_keys=True))
          PY
