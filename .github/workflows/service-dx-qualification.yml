name: Finish source-inventory quality and public RPC checks
on:
  push:
    branches: [codex/service-dx-qualification-20261026]
permissions:
  contents: read
concurrency:
  group: qualify-service-dx-stable
  cancel-in-progress: false
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_BUILD_JOBS: '2'
  CARGO_TERM_COLOR: never
  TLA2TOOLS_JAR: /tmp/tla2tools.jar
jobs:
  stable:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: 466550d0af43843957bd0a4b2c867913d13049be
      - name: Install matched tools and formal trace input
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt,clippy
          cmake --version
          clang --version
          java -version
          git submodule update --init --depth 1 -- vendor/capnproto
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar -o "$TLA2TOOLS_JAR"
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $TLA2TOOLS_JAR" | sha256sum --check --strict
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: release-packages
          cache-on-failure: true
      - name: Verify quality collector, linting and formatting with complete source inventory
        run: |
          cargo test --locked -p capntproto-quality --lib -- --test-threads=1
          cargo clippy --locked -p capntproto-rpc -p capntproto-quality --all-targets -- -D warnings
          cargo clippy --locked -p capntproto --features quic --test answer_adoption -- -D warnings
          cargo fmt --all -- --check
          cargo fmt --manifest-path benchmarks/rpc/Cargo.toml -- --check
          cargo fmt --manifest-path examples/kv/Cargo.toml -- --check
