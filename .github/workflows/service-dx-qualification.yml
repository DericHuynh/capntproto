name: Qualify portable direct paths and free-slot allocation
on:
  push:
    branches: [codex/service-dx-qualification-20261026]
permissions:
  contents: read
concurrency:
  group: qualify-shared-rpc-core
  cancel-in-progress: false
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_BUILD_JOBS: '2'
  CARGO_TERM_COLOR: never
jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: 49f529f3ac47c255b225ba59ee7a9bbd6980f81c
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cmake ninja-build clang capnproto libcapnp-dev protobuf-compiler libssl-dev
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt,clippy
          git submodule update --init --depth 1 vendor/capnproto
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: dedicated-benchmarks
          cache-on-failure: true
          workspaces: |
            . -> target
            benchmarks/rpc -> target
      - name: Final hosted regression batch and lint
        run: |
          cargo test --locked -p capntproto-rpc --lib
          cargo clippy --locked -p capntproto-rpc -p capntproto-rpc-wire -p capntproto-rpc-engine --all-targets -- -D warnings
          cargo fmt --all -- --check
  miri:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: 49f529f3ac47c255b225ba59ee7a9bbd6980f81c
      - name: Install memory interpreter
        run: rustup toolchain install nightly-2026-08-29 --profile minimal --component miri,rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: shared-notification-miri
          cache-on-failure: true
      - name: Interpret endpoint-credit and terminal-ownership regression
        env:
          MIRIFLAGS: -Zmiri-strict-provenance
        run: cargo +nightly-2026-08-29 miri test --locked --ignore-rust-version -p capntproto-rpc --lib direct_projection_credit_is_bounded_and_terminal_failure_reaches_retained_hooks
  verus:
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: 49f529f3ac47c255b225ba59ee7a9bbd6980f81c
      - run: git submodule update --init vendor/verus-tla
      - uses: ./.github/actions/dev-setup
        with:
          cache-key: verus-0.2026.10.04.426d8b0
      - run: cargo run --locked -p capntproto-dev -- verus install
      - run: cargo run --locked -p capntproto-dev -- verus verify --output target/verification/verus
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: portable-direct-verus
          path: target/verification/verus/
