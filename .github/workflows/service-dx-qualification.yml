name: Qualify legacy and portable regression matrix
on:
  push:
    branches: [codex/service-dx-qualification-20261026]
permissions:
  contents: read
concurrency:
  group: qualify-service-dx-stable
  cancel-in-progress: false
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_BUILD_JOBS: '2'
  CARGO_TERM_COLOR: never
  TLA2TOOLS_JAR: /tmp/tla2tools.jar
jobs:
  stable:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: 83b28c637b4011c08d86c9f679dafa1f9e21bf51
      - name: Install matched tools and formal trace input
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt,clippy
          cmake --version
          clang --version
          java -version
          git submodule update --init --depth 1 -- vendor/capnproto
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar -o "$TLA2TOOLS_JAR"
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $TLA2TOOLS_JAR" | sha256sum --check --strict
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: release-packages
          cache-on-failure: true
      - name: Run each shared regression independently
        run: |
          status=0
          for case in adopted_work_waits_for_retained_results_without_repolling_completed_execution third_party_pipeline_transfer_resumes_after_idle_at_each_poll_budget adoption_exposes_unused_pipeline_before_return_and_preserves_used_route tail_finish_before_child_completion_reclaims_both_interests third_party_tail_returns_over_authenticated_native; do
            cargo test --locked --features quic --test answer_adoption "$case" -- --exact --nocapture || status=1
          done
          exit "$status"
