name: Publish README reports
# This privileged completion trigger is intentional: only default-branch code
# runs, and repository/branch/event/commit/artifact identities are revalidated.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [Full quality, Dedicated benchmarks]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed Full quality or Dedicated benchmarks run from the default branch
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: readme-publication
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch &&
       github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      # Execute publisher code only from the trusted default branch, never from
      # the triggering run or its artifacts. The publisher repeats origin checks.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Install chart renderer in an isolated environment
        run: |
          python3 -m venv "$RUNNER_TEMP/readme-venv"
          "$RUNNER_TEMP/readme-venv/bin/pip" install --only-binary=:all: -r quality/reporting-requirements.txt
      - name: Publish generated README and report assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: '"$RUNNER_TEMP/readme-venv/bin/python" scripts/update_readme.py publish --event "$GITHUB_EVENT_PATH"'
