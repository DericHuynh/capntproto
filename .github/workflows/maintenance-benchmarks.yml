name: Maintenance / Benchmark cleanup
on:
  workflow_call:
    secrets:
      DIGITALOCEAN_ACCESS_TOKEN:
        description: Credential for this repository's expired benchmark resources
        required: true
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
concurrency:
  group: benchmark-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    environment: Benchmarking
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/dev-setup # zizmor: ignore[self-repository]
        with:
          cache-key: maintenance-benchmarks
      - name: Remove only this repository's expired benchmark droplets and keys
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: cargo run --locked -p capntproto-dev -- digitalocean-bench janitor --state "$RUNNER_TEMP/capntproto-do"
