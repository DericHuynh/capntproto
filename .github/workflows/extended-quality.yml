name: Extended quality
on:
  schedule:
    - cron: '37 4 * * 3'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: extended-quality-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
jobs:
  miri:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actionlint 1.7.12 requires the checked-out local action syntax.
      - uses: ./.github/actions/auditable-setup # zizmor: ignore[self-repository]
      - name: Memory-check prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y capnproto libcapnp-dev
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt,clippy
          rustup toolchain install nightly-2026-08-29 --profile minimal --component miri,rust-src
          git submodule update --init --depth 1 -- vendor/capnproto
      - name: Ownership checks plus big-endian and seed sweeps
        id: checks
        env:
          REPROTO_MIRI_EXTENDED: '1'
        run: cargo test --locked --test memory_safety
      - name: Summarize memory checks
        if: always()
        env:
          RESULT: ${{ steps.checks.outcome }}
        run: |
          mkdir -p target/verification/memory-safety
          # Markdown backticks in the format string are literal.
          # shellcheck disable=SC2016
          printf '# Extended Miri\n\nCommit: `%s`\n\nResult: **%s**. The ordinary 23-test ownership suite covers aligned/unaligned readers and both aliasing models. The extension runs six wire tests with seeds 2–5 on x86-64 and big-endian s390x: 48 additional interpreted executions. Only recorded executions are qualified; this is not native s390x platform support.\n\n[Source-bound results and log paths](checked.json). A failed run does not retain a prior checked.json.\n' "$GITHUB_SHA" "$RESULT" > target/verification/memory-safety/README.md
          cat target/verification/memory-safety/README.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: extended-miri
          path: target/verification/memory-safety/
          if-no-files-found: error
  careful:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actionlint 1.7.12 requires the checked-out local action syntax.
      - uses: ./.github/actions/auditable-setup # zizmor: ignore[self-repository]
      - name: Native-check prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y capnproto libcapnp-dev
          rustup toolchain install nightly-2026-08-29 --profile minimal --component rust-src
          cargo +nightly-2026-08-29 install cargo-careful --version 0.4.10 --locked
      - name: Native storage and descriptor checks
        id: checks
        env:
          CARGO_TARGET_DIR: target/careful
        run: |
          mkdir -p target/extended/careful
          rustc +nightly-2026-08-29 -vV > target/extended/careful/compiler.txt
          cargo +nightly-2026-08-29 careful test --locked -p reproto --lib storage::fault_tests 2>&1 | tee target/extended/careful/storage.log
          cargo +nightly-2026-08-29 careful test --locked -p reproto --test fd_capabilities --test serialization_reads --test allocations -- --skip replay_tlc_fd_traces 2>&1 | tee target/extended/careful/native.log
      - name: Summarize native checks
        if: always()
        env:
          RESULT: ${{ steps.checks.outcome }}
        run: |
          mkdir -p target/extended/careful
          # Markdown backticks in the format string are literal.
          # shellcheck disable=SC2016
          printf '# Native memory checks\n\nCommit: `%s`\n\nResult: **%s**. cargo-careful 0.4.10 on nightly-2026-08-29 checks storage fault recovery, native descriptor/RPC behavior, framing, and allocation budgets. The TLC replay remains in the full workspace gate and is excluded from this native-only run. These checks detect selected unsafe-precondition violations; C++ internals are not instrumented by cargo-careful.\n\n- [Storage fault tests](storage.log)\n- [Native tests](native.log)\n- [Compiler](compiler.txt)\n' "$GITHUB_SHA" "$RESULT" > target/extended/careful/README.md
          cat target/extended/careful/README.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-careful
          path: target/extended/careful/
          if-no-files-found: error
  llvm-lines:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actionlint 1.7.12 requires the checked-out local action syntax.
      - uses: ./.github/actions/auditable-setup # zizmor: ignore[self-repository]
      - name: IR-report prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y capnproto libcapnp-dev
          rustup toolchain install 1.97.0 --profile minimal
          cargo install cargo-llvm-lines --version 0.4.48 --locked
      - name: Report generated and runtime IR
        run: |
          mkdir -p target/extended/llvm-lines
          rustc -vV > target/extended/llvm-lines/compiler.txt
          cargo llvm-lines --locked --release -p reproto --lib > target/extended/llvm-lines/runtime.txt
          cargo llvm-lines --locked --release -p reproto --example native_store > target/extended/llvm-lines/consumer.txt
          # Markdown backticks in the format string are literal.
          # shellcheck disable=SC2016
          printf '# LLVM IR size\n\nCommit: `%s`\n\nReports include the default-feature runtime and the native_store consumer, where generic bindings are instantiated. Counts measure IR size and instantiations, not compilation time. No regression baseline is established.\n\n- [Runtime](runtime.txt)\n- [Consumer](consumer.txt)\n- [Compiler](compiler.txt)\n' "$GITHUB_SHA" > target/extended/llvm-lines/README.md
          cat target/extended/llvm-lines/README.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: llvm-ir-size
          path: target/extended/llvm-lines/
          if-no-files-found: error
