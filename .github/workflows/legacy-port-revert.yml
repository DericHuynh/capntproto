name: Legacy hosted rollback qualification
on:
  push:
    branches: [codex/legacy-port-revert-qualification-20261025]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  correctness:
    name: Hosted RPC, generated API and retained allocation improvements
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CC: clang
      CXX: clang++
      CAPNTPROTO_REFERENCE_CXX: clang++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/auditable-setup # zizmor: ignore[self-repository]
        with:
          cache-key: legacy-factoring
          workspaces: . -> target
      - name: Install only tools needed by the remaining checks
        run: |
          timeout 180s sudo apt-get update
          timeout 180s sudo apt-get install --no-install-recommends -y clang cmake ninja-build capnproto libcapnp-dev libssl-dev protobuf-compiler
          timeout 180s rustup component add rustfmt clippy
          timeout 180s rustup target add thumbv7em-none-eabi
          timeout 180s git submodule update --init --depth 1 -- vendor/capnproto
      # Library, API and transport tests passed in 40237812436. Miri passed
      # in both preceding runs. This source delta only aligns the reviewed
      # unsafe fingerprints; check-unsafe itself runs workspace/all-target
      # Clippy with -D warnings and the additional unsafe-documentation lints.
      - name: Validate unchanged unsafe debt and finish repository checks
        run: |
          cargo run --locked -p capntproto-dev -- check-unsafe
          cargo run --locked -p capntproto-dev -- check-repository
          cargo run --locked -p capntproto-dev -- wiki check
          cargo fmt --all -- --check
      - name: Preserve the existing bounded portable profile
        env:
          CARGO_TARGET_THUMBV7EM_NONE_EABI_LINKER: rust-lld
        run: |
          cargo check --locked -p capntproto-core --no-default-features --target thumbv7em-none-eabi
          cargo check --locked -p capntproto-rpc --no-default-features --target thumbv7em-none-eabi
          cargo check --locked -p capntproto-rpc --no-default-features --features alloc --target thumbv7em-none-eabi
          cargo build --locked --release --manifest-path verification/portable/Cargo.toml --target thumbv7em-none-eabi
