name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  RUST_BACKTRACE: '1'
jobs:
  workflows:
    name: Validate workflows
    uses: ./.github/workflows/ci-workflows.yml # zizmor: ignore[self-repository]
  documentation:
    name: Validate documentation
    needs: workflows
    uses: ./.github/workflows/ci-docs.yml # zizmor: ignore[self-repository]
  cargo:
    name: Tests and diagnostics
    needs: workflows
    uses: ./.github/workflows/verification-tests.yml # zizmor: ignore[self-repository]
  examples:
    name: TLS services and distributed checkout
    needs: workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/auditable-setup # zizmor: ignore[self-repository]
        with:
          cache-key: legacy-tokio-examples
      - name: Exercise schema services and distributed recovery
        run: cargo run --locked -p capntproto-dev -- examples
  models:
    name: Protocol and storage models
    needs: workflows
    uses: ./.github/workflows/verification-models.yml # zizmor: ignore[self-repository]
  fuzz:
    name: Codec and legacy RPC fuzzing
    needs: workflows
    uses: ./.github/workflows/verification-fuzz.yml # zizmor: ignore[self-repository]
  extended:
    name: Memory safety
    needs: workflows
    uses: ./.github/workflows/verification-extended.yml # zizmor: ignore[self-repository]
  performance:
    name: Instruction and allocation profiles
    needs: workflows
    uses: ./.github/workflows/performance.yml # zizmor: ignore[self-repository]
  report:
    name: CI
    if: always()
    needs: [workflows, documentation, cargo, examples, models, fuzz, extended, performance]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every CI lane
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = {name: value['result'] for name, value in results.items() if value['result'] != 'success'}
          if failed:
              raise SystemExit(f'CI lanes did not pass: {failed}')
          print('All legacy Tokio/rustls CI lanes passed. Coverage is independent.')
          PY
