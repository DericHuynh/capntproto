name: CI
on:
  # Branch work is checked through pull_request; only main needs push checks.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'
jobs:
  workflows:
    name: Validate workflows
    # actionlint 1.7.12 requires the checked-out reusable-workflow syntax.
    uses: ./.github/workflows/ci-workflows.yml # zizmor: ignore[self-repository]
  documentation:
    name: Validate documentation
    uses: ./.github/workflows/ci-docs.yml # zizmor: ignore[self-repository]
  platforms:
    name: Build and test (${{ matrix.os }})
    needs: workflows
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Keep generated output and large files out of Git
        shell: bash
        run: python scripts/check_repository.py
      - name: Check Cargo wrapper argument forwarding
        shell: bash
        run: bash scripts/test-auditable-cargo.sh
      - name: Pinned schema fixtures for compiler tests
        shell: bash
        run: git submodule update --init --depth 1 -- vendor/capnproto
      - name: Linux schema compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y capnproto libcapnp-dev cmake clang libclang-dev pkg-config
      - name: macOS schema compiler
        if: runner.os == 'macOS'
        run: |
          brew install capnp
          echo "CAPNP_INCLUDE_DIR=$(brew --prefix capnp)/include" >> "$GITHUB_ENV"
      - name: Windows schema compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP/capnp.zip"
          Invoke-WebRequest https://capnproto.org/capnproto-c++-win32-1.3.0.zip -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() -ne '2c503361f8bf26fa9e7caccb6db04d6b271d5f0ad3da0616cf40e9a51335c89c') { throw 'Compiler checksum mismatch' }
          Expand-Archive $zip "$env:RUNNER_TEMP/capnp"
          (Get-ChildItem "$env:RUNNER_TEMP/capnp" -Recurse -Filter capnp.exe | Select-Object -First 1).DirectoryName >> $env:GITHUB_PATH
          "CAPNP_INCLUDE_DIR=$env:RUNNER_TEMP/capnp/capnproto-c++-1.3.0/src" >> $env:GITHUB_ENV
      - name: Pinned Rust
        shell: bash
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt,clippy
          if test "$RUNNER_OS" = Linux; then
            rustup toolchain install nightly-2026-08-29 --profile minimal --component clippy
          fi
      # actionlint 1.7.12 requires the checked-out local action syntax.
      - uses: ./.github/actions/auditable-setup # zizmor: ignore[self-repository]
        with:
          cache-key: platform-${{ matrix.os }}
          workspaces: |
            . -> target
            examples/downstream -> target
      - name: Compile applications, Rust schema compiler, compatibility adapters and core package
        id: compile
        shell: bash
        run: |
          cargo build --locked -p capntproto --lib --bins
          cargo build --locked -p capntproto-compiler --lib --bins
          cargo build --locked -p capntproto-compat --lib
          cargo build --locked --manifest-path examples/downstream/Cargo.toml
          cargo package --locked --manifest-path crates/capntproto-core/Cargo.toml
          cargo clippy --locked --manifest-path crates/capntproto-core/Cargo.toml --all-targets -- -D warnings
      - name: Require embedded dependency inventories
        id: auditable
        shell: bash
        env:
          PLATFORM: ${{ matrix.os }}
        run: |
          suffix=''
          if test "$RUNNER_OS" = Windows; then suffix='.exe'; fi
          python scripts/check_auditable.py --output "target/platforms/auditable-$PLATFORM.json" \
            "target/debug/capntproto-model$suffix" \
            "target/debug/capntproto-compile$suffix" \
            "examples/downstream/target/debug/capntproto-preview-example$suffix"
      - name: Smoke capability RPC, Rust schema compiler and compatibility adapters
        id: smoke
        shell: bash
        run: |
          cargo run --locked --manifest-path examples/downstream/Cargo.toml
          python scripts/nextest_ci.py cargo -- --locked --no-fail-fast -p capntproto-compiler
          python scripts/nextest_ci.py cargo -- --locked -p capntproto-compat --test codecs --test adapters --test json_rpc
          python scripts/nextest_ci.py cargo -- --locked -p capntproto --test tcp_rpc --test secure_rpc
          python scripts/nextest_ci.py cargo -- --locked -p capntproto --test rpc_ownership --test native_vat
          python scripts/nextest_ci.py cargo -- --locked -p capntproto --lib transport::backend_tests
          python scripts/nextest_ci.py cargo -- --locked -p capntproto --lib rpc::quic::retry
          cargo test --locked -p capntproto-compiler --doc
          cargo check --locked -p capntproto --no-default-features --lib
          python scripts/nextest_ci.py cargo -- --locked -p capntproto --no-default-features --test rpc_ownership
          python scripts/nextest_ci.py cargo -- --locked -p capntproto --no-default-features --features storage --lib storage::components
          python scripts/nextest_ci.py cargo -- --locked -p capntproto --no-default-features --features storage --test component_orm
          python scripts/nextest_ci.py cargo -- --locked -p capntproto --no-default-features --features tls --test secure_rpc
          python scripts/nextest_ci.py cargo -- --locked -p capntproto --no-default-features --features quic --test secure_rpc
          python scripts/nextest_ci.py cargo -- --locked -p capntproto --test buffered_input scratch::
          python scripts/nextest_ci.py cargo -- --locked -p capntproto --test dynamic_groups -- --skip group_resets_match_pinned_cpp
          python scripts/nextest_ci.py cargo -- --locked -p capntproto --test dynamic_getters -- --skip mutable_getters_match_pinned_cpp
          python scripts/nextest_ci.py cargo -- --locked -p capntproto --test dynamic_nested_lists -- --skip nested_getters_match_pinned_cpp
          python scripts/nextest_ci.py cargo -- --locked -p capntproto --test dynamic_blobs -- --skip blob_access_matches_pinned_cpp
          python scripts/nextest_ci.py cargo -- --locked -p capntproto --test dynamic_pointers -- --skip pointer_views_match_pinned_cpp
          python scripts/nextest_ci.py cargo -- --locked -p capntproto --test loaded_view_casts -- --skip compatible_loaded_casts_match_pinned_cpp
          python scripts/nextest_ci.py cargo -- --locked -p capntproto --test capnp_root
          if test "$RUNNER_OS" != Windows; then
            python scripts/nextest_ci.py cargo -- --locked -p capntproto --lib unix_rpc:: -- --skip tlc --skip pinned_cpp
            python scripts/nextest_ci.py cargo -- --locked -p capntproto --test unix_facade --test fd_capabilities -- --skip tlc
            cargo clippy --locked -p capntproto --lib --test unix_facade --test fd_capabilities -- -D warnings
          fi
          if test "$RUNNER_OS" = Linux; then
            python scripts/nextest_ci.py cargo -- --locked -p capntproto --test tooling nightly_rpc_try_contracts -- --exact
          fi
      - name: Enforce allocation budgets on Linux
        id: allocations
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python scripts/nextest_ci.py cargo -- --locked -p capntproto --test allocations
      - name: Upstream QUIC v1 protocol and independent interoperability checks
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python scripts/nextest_ci.py cargo -- --locked -p capntproto --test tooling pinned_native_profile
          python scripts/nextest_ci.py cargo -- --locked -p capntproto --lib transport:: -- --skip tlc --skip transport::backend_tests
          python3 -m venv target/quic-interop-venv
          target/quic-interop-venv/bin/pip install -r scripts/requirements-quic-interop.txt
          cargo build --locked --example quic-interop --no-default-features --features quic
          target/quic-interop-venv/bin/python scripts/check_quic_interop.py
      - name: Platform result
        if: always()
        shell: bash
        env:
          PLATFORM: ${{ matrix.os }}
          COMPILE: ${{ steps.compile.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          ALLOCATIONS: ${{ steps.allocations.outcome }}
          AUDITABLE: ${{ steps.auditable.outcome }}
        run: |
          mkdir -p target/platforms
          printf '| %s | %s | %s | %s | %s |\n' "$PLATFORM" "$COMPILE" "$SMOKE" "$ALLOCATIONS" "$AUDITABLE" > "target/platforms/$PLATFORM.md"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: platform-${{ matrix.os }}
          path: target/platforms/
          if-no-files-found: error
      - name: Upload nextest results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: nextest-${{ matrix.os }}
          path: target/nextest/reports/
          if-no-files-found: warn
  report:
    name: Required CI result
    needs: [workflows, documentation, platforms]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: platform-*
          path: platforms
          merge-multiple: true
      - name: Generate README
        env:
          RESULT: ${{ needs.workflows.result == 'success' && needs.documentation.result == 'success' && needs.platforms.result == 'success' && 'success' || 'failure' }}
        run: |
          # Markdown backticks in the format string are literal.
          # shellcheck disable=SC2016
          printf '# Platform checks\n\nCommit: `%s`\n\nDefault features: Native, services, storage, TLS and standard QUIC. Smoke checks exercise TCP, TLS/mTLS, QUIC/mTLS, the Rust schema compiler, generated capability RPC and pipelining; Linux/macOS also check storage reopen and descriptor-aware Unix RPC (ownership, limits, cancellation and scratch slots). Linux also enforces allocation budgets. All platforms require embedded cargo-auditable inventories in the application and schema-compiler binaries. Windows also runs component storage and retained-snapshot checks; power-loss durability is not qualified by CI.\n\n| Platform | Compile | Smoke | Allocation budgets (Linux) | Embedded dependency metadata |\n| --- | --- | --- | --- | --- |\n' "$GITHUB_SHA" > README.md
          for platform in ubuntu-24.04 macos-15 windows-2025; do
            if test -f "platforms/$platform.md"; then cat "platforms/$platform.md" >> README.md; else printf '| %s | missing | missing | missing | missing |\n' "$platform" >> README.md; fi
          done
          printf '\nCargo tests and LLVM reporting run in Verification / Cargo tests. TLA+ models and fuzzing have independent Verification workflows. Performance runs separately in Performance / Dedicated benchmarks; unmeasured coverage/performance is not implied by a smoke pass.\n' >> README.md
          cat README.md >> "$GITHUB_STEP_SUMMARY"
          test "$RESULT" = success
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: platform-report
          path: |
            README.md
            platforms/auditable-*.json
          if-no-files-found: error
