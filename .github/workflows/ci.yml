name: CI
on:
  # Branch work is checked through pull_request; only main needs push checks.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # Do not interrupt paid measurements on main; obsolete PR checks may stop.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'
jobs:
  workflows:
    name: Validate workflows
    # actionlint 1.7.12 requires the checked-out reusable-workflow syntax.
    uses: ./.github/workflows/ci-workflows.yml # zizmor: ignore[self-repository]
  documentation:
    name: Validate documentation
    uses: ./.github/workflows/ci-docs.yml # zizmor: ignore[self-repository]
  platforms:
    name: Build and test (${{ matrix.os }})
    needs: workflows
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check Cargo wrapper argument forwarding
        shell: bash
        run: bash scripts/test-auditable-cargo.sh
      - name: Pinned schema fixtures for compiler tests
        shell: bash
        run: git submodule update --init --depth 1 -- vendor/capnproto
      - name: Linux schema compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y capnproto libcapnp-dev cmake clang libclang-dev pkg-config
      - name: macOS schema compiler
        if: runner.os == 'macOS'
        run: |
          brew install capnp
          echo "CAPNP_INCLUDE_DIR=$(brew --prefix capnp)/include" >> "$GITHUB_ENV"
      - name: Windows schema compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP/capnp.zip"
          Invoke-WebRequest https://capnproto.org/capnproto-c++-win32-1.3.0.zip -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() -ne '2c503361f8bf26fa9e7caccb6db04d6b271d5f0ad3da0616cf40e9a51335c89c') { throw 'Compiler checksum mismatch' }
          Expand-Archive $zip "$env:RUNNER_TEMP/capnp"
          (Get-ChildItem "$env:RUNNER_TEMP/capnp" -Recurse -Filter capnp.exe | Select-Object -First 1).DirectoryName >> $env:GITHUB_PATH
          "CAPNP_INCLUDE_DIR=$env:RUNNER_TEMP/capnp/capnproto-c++-1.3.0/src" >> $env:GITHUB_ENV
      - name: Pinned Rust
        shell: bash
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt,clippy
          if test "$RUNNER_OS" = Linux; then
            rustup toolchain install nightly-2026-08-29 --profile minimal --component clippy
          fi
      # actionlint 1.7.12 requires the checked-out local action syntax.
      - uses: ./.github/actions/auditable-setup # zizmor: ignore[self-repository]
        with:
          cache-key: platform-${{ matrix.os }}
          workspaces: |
            . -> target
            examples/downstream -> target
      - name: Keep generated output and large files out of Git
        shell: bash
        run: cargo run --locked -p capntproto-dev -- check-repository
      - name: Compile applications, Rust schema compiler, compatibility adapters and core package
        id: compile
        shell: bash
        run: |
          cargo build --locked -p capntproto --lib --bins
          cargo build --locked -p capntproto-compiler --lib --bins
          cargo build --locked -p capntproto-compat --lib
          cargo build --locked --manifest-path examples/downstream/Cargo.toml
          cargo package --locked --manifest-path crates/capntproto-core/Cargo.toml
          cargo clippy --locked --manifest-path crates/capntproto-core/Cargo.toml --all-targets -- -D warnings
      - name: Enforce unsafe documentation and frozen imported debt
        if: runner.os == 'Linux'
        run: cargo run --locked -p capntproto-dev -- check-unsafe
      - name: Require embedded dependency inventories
        id: auditable
        shell: bash
        env:
          PLATFORM: ${{ matrix.os }}
        run: |
          suffix=''
          if test "$RUNNER_OS" = Windows; then suffix='.exe'; fi
          cargo run --locked -p capntproto-dev -- check-auditable --output "target/platforms/auditable-$PLATFORM.json" \
            "target/debug/capntproto-model$suffix" \
            "target/debug/capntproto-compile$suffix" \
            "examples/downstream/target/debug/capntproto-preview-example$suffix"
      - name: Smoke capability RPC, Rust schema compiler and compatibility adapters
        id: smoke
        shell: bash
        run: |
          cargo run --locked --manifest-path examples/downstream/Cargo.toml
          cargo run --locked -p capntproto-dev -- nextest cargo -- --locked --no-fail-fast -p capntproto-compiler
          cargo run --locked -p capntproto-dev -- nextest cargo -- --locked -p capntproto-compat --test codecs --test adapters --test json_rpc
          cargo run --locked -p capntproto-dev -- nextest cargo -- --locked -p capntproto --test tcp_rpc --test secure_rpc
          cargo run --locked -p capntproto-dev -- nextest cargo -- --locked -p capntproto --test rpc_ownership --test native_vat
          cargo run --locked -p capntproto-dev -- nextest cargo -- --locked -p capntproto --lib transport::backend_tests
          cargo run --locked -p capntproto-dev -- nextest cargo -- --locked -p capntproto --lib rpc::quic::retry
          cargo test --locked -p capntproto-compiler --doc
          cargo check --locked -p capntproto --no-default-features --lib
          cargo run --locked -p capntproto-dev -- nextest cargo -- --locked -p capntproto --no-default-features --test rpc_ownership
          cargo run --locked -p capntproto-dev -- nextest cargo -- --locked -p capntproto --no-default-features --features storage --lib storage::components
          cargo run --locked -p capntproto-dev -- nextest cargo -- --locked -p capntproto --no-default-features --features storage --test component_orm
          cargo run --locked -p capntproto-dev -- nextest cargo -- --locked -p capntproto --no-default-features --features tls --test secure_rpc
          cargo run --locked -p capntproto-dev -- nextest cargo -- --locked -p capntproto --no-default-features --features quic --test secure_rpc
          cargo run --locked -p capntproto-dev -- nextest cargo -- --locked -p capntproto --test buffered_input scratch::
          cargo run --locked -p capntproto-dev -- nextest cargo -- --locked -p capntproto --test dynamic_groups -- --skip group_resets_match_pinned_cpp
          cargo run --locked -p capntproto-dev -- nextest cargo -- --locked -p capntproto --test dynamic_getters -- --skip mutable_getters_match_pinned_cpp
          cargo run --locked -p capntproto-dev -- nextest cargo -- --locked -p capntproto --test dynamic_nested_lists -- --skip nested_getters_match_pinned_cpp
          cargo run --locked -p capntproto-dev -- nextest cargo -- --locked -p capntproto --test dynamic_blobs -- --skip blob_access_matches_pinned_cpp
          cargo run --locked -p capntproto-dev -- nextest cargo -- --locked -p capntproto --test dynamic_pointers -- --skip pointer_views_match_pinned_cpp
          cargo run --locked -p capntproto-dev -- nextest cargo -- --locked -p capntproto --test loaded_view_casts -- --skip compatible_loaded_casts_match_pinned_cpp
          cargo run --locked -p capntproto-dev -- nextest cargo -- --locked -p capntproto --test capnp_root
          if test "$RUNNER_OS" != Windows; then
            cargo run --locked -p capntproto-dev -- nextest cargo -- --locked -p capntproto --lib unix_rpc:: -- --skip tlc --skip pinned_cpp
            cargo run --locked -p capntproto-dev -- nextest cargo -- --locked -p capntproto --test unix_facade --test fd_capabilities -- --skip tlc
            cargo clippy --locked -p capntproto --lib --test unix_facade --test fd_capabilities -- -D warnings
          fi
          if test "$RUNNER_OS" = Linux; then
            cargo run --locked -p capntproto-dev -- nextest cargo -- --locked -p capntproto --test tooling nightly_rpc_try_contracts -- --exact
          fi
      - name: Enforce allocation budgets on Linux
        id: allocations
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo run --locked -p capntproto-dev -- nextest cargo -- --locked -p capntproto --test allocations
      - name: Upstream QUIC v1 protocol and independent interoperability checks
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo run --locked -p capntproto-dev -- nextest cargo -- --locked -p capntproto --test tooling pinned_native_profile
          cargo run --locked -p capntproto-dev -- nextest cargo -- --locked -p capntproto --lib transport:: -- --skip tlc --skip transport::backend_tests
          cargo build --locked --example quic-interop --no-default-features --features quic
          cargo clippy --locked -p capntproto-dev --features quic-interop --all-targets -- -D warnings
          cargo run --locked -p capntproto-dev --features quic-interop -- check-quic-interop
      - name: Platform result
        if: always()
        shell: bash
        env:
          PLATFORM: ${{ matrix.os }}
          COMPILE: ${{ steps.compile.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          ALLOCATIONS: ${{ steps.allocations.outcome }}
          AUDITABLE: ${{ steps.auditable.outcome }}
        run: |
          mkdir -p target/platforms
          printf '| %s | %s | %s | %s | %s |\n' "$PLATFORM" "$COMPILE" "$SMOKE" "$ALLOCATIONS" "$AUDITABLE" > "target/platforms/$PLATFORM.md"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: platform-${{ matrix.os }}
          overwrite: true
          path: target/platforms/
          if-no-files-found: error
      - name: Upload nextest results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: nextest-${{ matrix.os }}
          overwrite: true
          path: target/nextest/reports/
          if-no-files-found: warn
  report:
    name: Required CI result
    needs: [workflows, documentation, platforms, cargo, models, fuzz, extended, performance, cleanup]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: platform-*-*
          path: platforms
          merge-multiple: true
      - name: Generate README
        if: always()
        env:
          RESULTS: ${{ toJSON(needs) }}
          CLOUD: ${{ github.actor_id != '49699333' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        run: |
          # Markdown backticks in the format string are literal.
          # shellcheck disable=SC2016
          printf '# Platform checks\n\nCommit: `%s`\n\nDefault features: Native, services, storage, TLS and standard QUIC. Smoke checks exercise TCP, TLS/mTLS, QUIC/mTLS, the Rust schema compiler, generated capability RPC and pipelining; Linux/macOS also check storage reopen and descriptor-aware Unix RPC (ownership, limits, cancellation and scratch slots). Linux also enforces allocation budgets. All platforms require embedded cargo-auditable inventories in the application and schema-compiler binaries. Windows also runs component storage and retained-snapshot checks; power-loss durability is not qualified by CI.\n\n| Platform | Compile | Smoke | Allocation budgets (Linux) | Embedded dependency metadata |\n| --- | --- | --- | --- | --- |\n' "$GITHUB_SHA" > README.md
          for platform in ubuntu-24.04 macos-15 windows-2025; do
            if test -f "platforms/$platform.md"; then cat "platforms/$platform.md" >> README.md; else printf '| %s | missing | missing | missing | missing |\n' "$platform" >> README.md; fi
          done
          {
            printf '\n## Pipeline results\n\n'
            jq -r 'to_entries[] | "- \(.key): \(.value.result)"' <<< "$RESULTS"
            printf '\nCargo/coverage, TLA+, fuzzing and extended checks run after platform checks. Release benchmarks follow verification. Fork and Dependabot PRs build benchmarks without cloud credentials; their cloud measurement and cleanup are skipped. CodeQL runs independently through GitHub default setup.\n'
          } >> README.md
          cat README.md >> "$GITHUB_STEP_SUMMARY"
          jq -e --arg cloud "$CLOUD" 'to_entries | all(.[]; if .key == "cleanup" and $cloud == "false" then .value.result == "skipped" else .value.result == "success" end)' <<< "$RESULTS"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: platform-report
          overwrite: true
          path: |
            README.md
            platforms/auditable-*.json
          if-no-files-found: error
  cargo:
    name: Verify Cargo tests and coverage
    needs: [platforms, documentation]
    uses: ./.github/workflows/verification-tests.yml # zizmor: ignore[self-repository]
  models:
    name: Verify TLA+ models
    needs: [platforms, documentation]
    uses: ./.github/workflows/verification-models.yml # zizmor: ignore[self-repository]
  fuzz:
    name: Verify fuzz targets
    needs: [platforms, documentation]
    uses: ./.github/workflows/verification-fuzz.yml # zizmor: ignore[self-repository]
  extended:
    name: Verify memory safety and mutation controls
    needs: [platforms, documentation]
    uses: ./.github/workflows/verification-extended.yml # zizmor: ignore[self-repository]
  performance:
    name: Build and measure release benchmarks
    needs: [cargo, models, fuzz, extended]
    uses: ./.github/workflows/performance.yml # zizmor: ignore[self-repository]
    secrets:
      DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
  cleanup:
    name: Recover expired benchmark resources
    needs: performance
    # 49699333 is Dependabot's immutable GitHub actor ID.
    if: >-
      always() && github.actor_id != '49699333' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/maintenance-benchmarks.yml # zizmor: ignore[self-repository]
    secrets:
      DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
