name: Reports / Publish
# This privileged completion trigger is intentional: only default-branch code
# runs, and repository/branch/event/commit/artifact identities are revalidated.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    # Workflow names are glob patterns; match TLA+'s plus literally.
    workflows:
      - Verification / Cargo tests
      - 'Verification / TLA\+ models'
      - Verification / Fuzzing
      - Performance / Dedicated benchmarks
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed Cargo, TLA+, fuzzing or benchmark run from the default branch
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: report-publication
  cancel-in-progress: false
jobs:
  publish:
    name: Validate producer evidence and publish reports
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch &&
       github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      # Execute publisher code only from the trusted default branch, never from
      # the triggering run or its artifacts. The publisher repeats origin checks.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: ./.github/actions/dev-setup # zizmor: ignore[self-repository]
        with:
          cache-key: reports
      - name: Publish dashboard and graphs to reports branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # GitHub Git API publication; this command does not publish Cargo packages.
        run: cargo run --locked -p capntproto-dev -- reports publish --event "$GITHUB_EVENT_PATH" # zizmor: ignore[use-trusted-publishing]
