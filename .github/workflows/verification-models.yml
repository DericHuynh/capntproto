name: Verification / Formal checks
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '29 3 * * 1'
permissions:
  contents: read
concurrency:
  group: verification-models-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'
jobs:
  kani:
    name: Prove portable Rust with Kani and mutation controls
    runs-on: ubuntu-26.04
    # The campaign includes 68 proofs and 58 separately compiled fault controls.
    # Leave room for the complete campaign and reports; each proof retains its
    # own 180-second verifier deadline.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/dev-setup # zizmor: ignore[self-repository]
        with:
          cache-key: kani-0.68.0
      - name: Install pinned Kani and verified release bundle
        run: |
          cargo install kani-verifier --version 0.68.0 --locked
          curl --fail --location --retry 3 https://github.com/model-checking/kani/releases/download/kani-0.68.0/kani-0.68.0-x86_64-unknown-linux-gnu.tar.gz -o "$RUNNER_TEMP/kani.tar.gz"
          echo "32e2b484d73ede0bbf64a2cf0879c4259422497d8aec4ee67d448de9ae7843d3  $RUNNER_TEMP/kani.tar.gz" | sha256sum --check --strict
          cargo kani setup --use-local-bundle "$RUNNER_TEMP/kani.tar.gz"
          cargo fetch --locked
      - name: Prove production code and detect deliberate faults
        run: cargo run --locked -p capntproto-dev -- kani --output target/verification/kani
      - id: kani-report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: kani-report
          path: target/verification/kani/
          if-no-files-found: warn
          retention-days: 30
      - name: Link proof failures, counterexamples and graph
        if: always()
        env:
          REPORT_URL: ${{ steps.kani-report.outputs.artifact-url }}
        run: |
          printf '[Kani proofs, counterexamples and per-harness graph](%s)\n' "$REPORT_URL" >> "$GITHUB_STEP_SUMMARY"
          if test -f target/verification/kani/FAILED-PROOFS.md; then
            cat target/verification/kani/FAILED-PROOFS.md >> "$GITHUB_STEP_SUMMARY"
          fi
  models:
    name: Check distributed TLA+ models after Rust proofs
    needs: kani
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actionlint 1.7.12 requires checked-out local action syntax.
      - uses: ./.github/actions/quality-setup # zizmor: ignore[self-repository]
        with:
          lane: models
      - name: Run TLA+ models
        env:
          TLA2TOOLS_JAR: ${{ runner.temp }}/tla2tools.jar
        run: cargo run --locked -p capntproto-quality -- models target/quality/models
      - name: Collect counts, graphs and failed tests
        if: success() || failure()
        run: cargo run --locked -p capntproto-dev -- reports collect --input target/quality --kind models --output target/readme-data/publication.json --failures-output target/quality/models/FAILED-TESTS.md --report-output target/quality/models
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: readme-data-models-${{ github.run_attempt }}
          path: target/readme-data/publication.json
          if-no-files-found: warn
          retention-days: 90
      - id: report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: models-report
          overwrite: true
          path: |
            target/quality/models/
            target/verification/**/tlc.log
            target/verification/**/model.cfg
          if-no-files-found: warn
          retention-days: 30
      - name: Link all results and diagnostics
        if: always()
        env:
          REPORT_URL: ${{ steps.report.outputs.artifact-url }}
        run: |
          printf '[Download all results, graphs and diagnostics](%s)\n' "$REPORT_URL" >> "$GITHUB_STEP_SUMMARY"
          if test -f target/quality/models/FAILED-TESTS.md; then
            cat target/quality/models/FAILED-TESTS.md >> "$GITHUB_STEP_SUMMARY"
          fi
