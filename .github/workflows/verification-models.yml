name: Verification / Formal checks
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '29 3 * * 1'
permissions:
  contents: read
concurrency:
  group: verification-models-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'
jobs:
  verus:
    name: Verus / Source contracts and temporal induction
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Initialize pinned temporal proof library
        run: git submodule update --init vendor/verus-tla
      - uses: ./.github/actions/dev-setup # zizmor: ignore[self-repository]
        with:
          cache-key: verus-0.2026.10.04.426d8b0
      - name: Install checksum-pinned Verus and its proof toolchain
        run: cargo run --locked -p capntproto-dev -- verus install
      - name: Verify production code, temporal library and negative controls
        timeout-minutes: 15
        run: cargo run --locked -p capntproto-dev -- verus verify --output target/verification/verus
      - id: verus-report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: verus-report
          path: target/verification/verus/
          if-no-files-found: warn
          retention-days: 30
      - name: Link proof results and diagnostics
        if: always()
        env:
          REPORT_URL: ${{ steps.verus-report.outputs.artifact-url }}
        run: |
          printf '[Verus proofs, temporal induction and mutation diagnostics](%s)\n' "$REPORT_URL" >> "$GITHUB_STEP_SUMMARY"
          if test -f target/verification/verus/README.md; then
            cat target/verification/verus/README.md >> "$GITHUB_STEP_SUMMARY"
          fi
  kani:
    name: Kani proofs and mutation controls (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Every proof and its controls belong to exactly one shard. A single verifier
    # avoids concurrent solver memory peaks; keep time for diagnostics/upload.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/dev-setup # zizmor: ignore[self-repository]
        with:
          cache-key: kani-0.68.0
      - name: Install pinned Kani and verified release bundle
        run: |
          cargo install kani-verifier --version 0.68.0 --locked
          curl --fail --location --retry 3 https://github.com/model-checking/kani/releases/download/kani-0.68.0/kani-0.68.0-x86_64-unknown-linux-gnu.tar.gz -o "$RUNNER_TEMP/kani.tar.gz"
          echo "32e2b484d73ede0bbf64a2cf0879c4259422497d8aec4ee67d448de9ae7843d3  $RUNNER_TEMP/kani.tar.gz" | sha256sum --check --strict
          cargo kani setup --use-local-bundle "$RUNNER_TEMP/kani.tar.gz"
          cargo fetch --locked
      - name: Prove production code and detect deliberate faults
        timeout-minutes: 65
        env:
          KANI_SHARD: ${{ matrix.shard }}
        run: |
          # Reserve host memory for the runner. Limit each verifier descendant;
          # an exhausted process fails the shard and cannot count as a proof.
          ulimit -v 10485760
          cargo run --locked -p capntproto-dev -- kani --jobs 1 --shard "$KANI_SHARD" --shards 4 --output target/verification/kani
      - id: kani-report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: kani-report-${{ matrix.shard }}
          path: target/verification/kani/
          if-no-files-found: warn
          retention-days: 30
      - name: Link proof failures, counterexamples and graph
        if: always()
        env:
          REPORT_URL: ${{ steps.kani-report.outputs.artifact-url }}
        run: |
          printf '[Kani proofs, counterexamples and per-harness graph](%s)\n' "$REPORT_URL" >> "$GITHUB_STEP_SUMMARY"
          if test -f target/verification/kani/FAILED-PROOFS.md; then
            cat target/verification/kani/FAILED-PROOFS.md >> "$GITHUB_STEP_SUMMARY"
          fi
  models:
    name: Check distributed TLA+ models after Rust proofs
    needs: [verus, kani]
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actionlint 1.7.12 requires checked-out local action syntax.
      - uses: ./.github/actions/quality-setup # zizmor: ignore[self-repository]
        with:
          lane: models
      - name: Run TLA+ models
        env:
          TLA2TOOLS_JAR: ${{ runner.temp }}/tla2tools.jar
        run: cargo run --locked -p capntproto-quality -- models target/quality/models
      - name: Collect counts, graphs and failed tests
        if: success() || failure()
        run: cargo run --locked -p capntproto-dev -- reports collect --input target/quality --kind models --output target/readme-data/publication.json --failures-output target/quality/models/FAILED-TESTS.md --report-output target/quality/models
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: readme-data-models-${{ github.run_attempt }}
          path: target/readme-data/publication.json
          if-no-files-found: warn
          retention-days: 90
      - id: report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: models-report
          overwrite: true
          path: |
            target/quality/models/
            target/verification/**/tlc.log
            target/verification/**/model.cfg
          if-no-files-found: warn
          retention-days: 30
      - name: Link all results and diagnostics
        if: always()
        env:
          REPORT_URL: ${{ steps.report.outputs.artifact-url }}
        run: |
          printf '[Download all results, graphs and diagnostics](%s)\n' "$REPORT_URL" >> "$GITHUB_STEP_SUMMARY"
          if test -f target/quality/models/FAILED-TESTS.md; then
            cat target/quality/models/FAILED-TESTS.md >> "$GITHUB_STEP_SUMMARY"
          fi
