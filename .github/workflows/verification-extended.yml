name: Verification / Memory safety
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'
permissions:
  contents: read
jobs:
  miri:
    name: Miri codec and legacy ownership
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/auditable-setup # zizmor: ignore[self-repository]
        with:
          cache-key: legacy-miri
          workspaces: |
            . -> target
            verification/miri -> target
      - name: Install the pinned memory interpreter
        run: rustup toolchain install nightly-2026-08-29 --profile minimal --component miri,rust-src
      - name: Check reader and ownership invariants
        run: |
          cargo +nightly-2026-08-29 miri test --locked --manifest-path verification/miri/Cargo.toml
          cargo +nightly-2026-08-29 miri test --locked -p capntproto-rpc --lib sender_queue::tests
          cargo +nightly-2026-08-29 miri test --locked -p capntproto-rpc --lib queued::tests
