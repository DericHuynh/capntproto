name: Performance / Legacy threshold selection
on:
  push:
    branches: [codex/legacy-threshold-qualification-20261025]
permissions:
  contents: read
jobs:
  verify:
    name: Verify threshold selection with original Return release and repeat hosted profiles
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/legacy-factoring
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 8
      - uses: ./.github/actions/auditable-setup
        with:
          cache-key: legacy-factoring
          workspaces: |
            . -> target/legacy-factoring
      - name: Install build and diagnostic tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang cmake ninja-build capnproto libcapnp-dev protobuf-compiler libssl-dev valgrind binutils
          rustup target add thumbv7em-none-eabi thumbv6m-none-eabi
      # Full hosted matrix passed the test step in40207050684. Scheduler
      # Miri38 passed there; original Return release passed in40205963099.
      # Threshold selection has the same exhaustive transition relation; run
      # its focused both-width Miri job below as well as the native tests.
      - name: Check shared scheduling and actual legacy ownership
        run: |
          python3 -m unittest discover -s benchmarks/rpc -p test_work_profile.py
          python3 -m unittest discover -s verification/legacy-alloc -p test_owner_type_names.py
          cargo test --locked -p capntproto-rpc-engine --no-default-features --lib
          cargo test --locked -p capntproto-rpc-engine --features alloc --lib
          cargo test --locked --manifest-path verification/legacy-alloc/Cargo.toml 2>&1 | tee "$RUNNER_TEMP/legacy-alloc-fixture.txt"
          cargo fmt --all -- --check
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c6900f3210c7d8505d47ea8821e419c2f492b2ab
          path: target/legacy-profile-source
          persist-credentials: false
      - name: Build current factored control
        run: |
          cargo build --locked --release --manifest-path target/legacy-profile-source/benchmarks/rpc/Cargo.toml --bin capntproto-rpc-bench
          cp target/legacy-factoring/release/capntproto-rpc-bench "$RUNNER_TEMP/legacy-factored"
      # Build both revisions at the same path so package IDs and embedded
      # source locations do not confound instruction and section comparisons.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: target/legacy-profile-source
          persist-credentials: false
      - name: Build candidate and check encrypted behavior
        run: |
          cargo build --locked --release --manifest-path target/legacy-profile-source/benchmarks/rpc/Cargo.toml --bin capntproto-rpc-bench
      - name: Repeat instructions, branches and allocations against factored control
        run: |
          python3 benchmarks/rpc/legacy-work-profile.py --pair-only --candidate target/legacy-factoring/release/capntproto-rpc-bench --factored "$RUNNER_TEMP/legacy-factored" --output "$RUNNER_TEMP/legacy-work-diagnostics"
          python3 verification/legacy-alloc/canonicalize-owner-types.py "$RUNNER_TEMP/legacy-work-diagnostics"
          cp "$RUNNER_TEMP/legacy-alloc-fixture.txt" "$RUNNER_TEMP/legacy-work-diagnostics/legacy-alloc-fixture.txt"
      - name: Publish comparison
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/legacy-work-diagnostics/comparison.md"; then
            cat "$RUNNER_TEMP/legacy-work-diagnostics/comparison.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: legacy-work-diagnostics
          path: ${{ runner.temp }}/legacy-work-diagnostics
          if-no-files-found: warn

  miri:
    name: Threshold selection and fixed scheduler under Miri
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      MIRIFLAGS: -Zmiri-strict-provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install schema compiler
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y capnproto libcapnp-dev
      - name: Install pinned memory checker
        run: rustup toolchain install nightly-2026-08-29 --profile minimal --component miri,rust-src
      - name: Check both widths and scheduling profiles
        run: |
          cargo +nightly-2026-08-29 miri test --locked -p capntproto-rpc-engine --no-default-features --lib scheduler::tests
          cargo +nightly-2026-08-29 miri test --locked -p capntproto-rpc-engine --no-default-features --lib --target i686-unknown-linux-gnu scheduler::tests
          cargo +nightly-2026-08-29 miri test --locked -p capntproto-rpc-engine --features alloc --lib scheduler::tests
          cargo +nightly-2026-08-29 miri test --locked -p capntproto-rpc-engine --features alloc --lib --target i686-unknown-linux-gnu scheduler::tests
