name: Verification / Fuzzing
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '39 3 * * 1'
permissions:
  contents: read
jobs:
  fuzz:
    name: Fuzz codec and legacy RPC
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/auditable-setup # zizmor: ignore[self-repository]
        with:
          cache-key: legacy-fuzz
          workspaces: |
            . -> target
            fuzz -> target
      - name: Install pinned fuzz tools
        run: |
          rustup toolchain install nightly-2026-08-29 --profile minimal
          cargo install cargo-fuzz --version 0.13.1 --locked
      - name: Exercise every supported fuzz target
        run: |
          for target in rpc_lifecycle capnp_framing capnp_pointers capnp_schema; do
            cargo +nightly-2026-08-29 fuzz run --features fuzz-targets "$target" -- \
              -max_total_time=30 -timeout=5 -rss_limit_mb=2048 -seed=1
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: legacy-fuzz-findings
          path: |
            fuzz/artifacts/
            fuzz/corpus/
          if-no-files-found: warn
          retention-days: 30
