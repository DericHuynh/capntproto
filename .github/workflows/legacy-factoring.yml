name: Performance / Legacy cancellation factoring
on:
  push:
    branches: [codex/legacy-cancellation-qualification-20261024]
permissions:
  contents: read
jobs:
  verify:
    name: Verify extraction and compare legacy work
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/legacy-factoring
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/auditable-setup
        with:
          cache-key: legacy-factoring
          workspaces: |
            . -> target/legacy-factoring
      - name: Install build and diagnostic tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang cmake ninja-build capnproto libcapnp-dev protobuf-compiler libssl-dev valgrind binutils
          rustup target add thumbv7em-none-eabi
      - name: Test shared completion and hosted RPC
        run: |
          cargo test --locked -p capntproto-rpc-engine --features alloc --lib
          cargo test --locked -p capntproto-rpc-engine --no-default-features --lib
          cargo clippy --locked -p capntproto-rpc-engine --features alloc --all-targets -- -D warnings
          cargo build --locked -p capntproto-rpc-engine --no-default-features --target thumbv7em-none-eabi
          rustc --edition=2021 --target thumbv7em-none-eabi -C panic=abort -C opt-level=2 -L dependency="$CARGO_TARGET_DIR/thumbv7em-none-eabi/debug/deps" --extern capntproto_rpc_engine="$CARGO_TARGET_DIR/thumbv7em-none-eabi/debug/libcapntproto_rpc_engine.rlib" verification/portable/legacy-cancellation-link.rs -o "$RUNNER_TEMP/legacy-cancellation.elf"
          python3 verification/portable/verify-legacy-cancellation-link.py --elf "$RUNNER_TEMP/legacy-cancellation.elf" > "$RUNNER_TEMP/legacy-cancellation-link.json"
          cargo check --locked -p capntproto-rpc --no-default-features --target thumbv7em-none-eabi
          cargo test --locked -p capntproto-rpc --lib
          cargo clippy --locked -p capntproto-rpc --all-targets -- -D warnings
          cargo fmt --all -- --check
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 54f9c2e829c5274ef10c0703d402172ff25031b1
          path: target/legacy-baseline-source
          persist-credentials: false
      - name: Build frozen legacy control
        run: |
          cargo build --locked --release --manifest-path target/legacy-baseline-source/benchmarks/rpc/Cargo.toml --bin capntproto-rpc-bench
          cp target/legacy-factoring/release/capntproto-rpc-bench "$RUNNER_TEMP/legacy-baseline"
      - name: Build factored legacy and check encrypted behavior
        run: |
          cargo build --locked --release --manifest-path benchmarks/rpc/Cargo.toml --bin capntproto-rpc-bench
          cargo test --locked -p capntproto --features quic --test secure_rpc
      - name: Compare instructions and allocations after all builds finish
        run: |
          python3 benchmarks/rpc/legacy-factoring-profile.py --rust target/legacy-factoring/release/capntproto-rpc-bench --baseline "$RUNNER_TEMP/legacy-baseline" --output "$RUNNER_TEMP/legacy-factoring-diagnostics"
          cp "$RUNNER_TEMP/legacy-cancellation-link.json" "$RUNNER_TEMP/legacy-factoring-diagnostics/embedded-link.json"
      - name: Publish comparison
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/legacy-factoring-diagnostics/comparison.md"; then
            cat "$RUNNER_TEMP/legacy-factoring-diagnostics/comparison.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: legacy-factoring-diagnostics
          path: ${{ runner.temp }}/legacy-factoring-diagnostics
          if-no-files-found: warn
  latency:
    needs: verify
    uses: ./.github/workflows/performance.yml
    with:
      campaign: run-latency
      portable_base: 54f9c2e829c5274ef10c0703d402172ff25031b1
      legacy_base: 54f9c2e829c5274ef10c0703d402172ff25031b1
      region: auto
      size: auto
    secrets: inherit
