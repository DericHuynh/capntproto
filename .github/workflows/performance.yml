name: Performance / Dedicated benchmarks
on:
  # Explicit qualification updates run the same dedicated campaign without
  # waiting for the PR's longer coverage/formal verification dependency chain.
  push:
    branches: [codex/portable-qualification]
  workflow_call:
    secrets:
      DIGITALOCEAN_ACCESS_TOKEN:
        description: Dedicated benchmark provisioning and cleanup credential
        required: false # Fork and Dependabot PRs only compile the bundle.
    inputs:
      campaign:
        default: run-remote
        type: string
      region:
        default: auto
        type: string
      size:
        default: auto
        type: string
  workflow_dispatch:
    inputs:
      campaign:
        description: Encrypted dedicated-loopback profiles or two-peer VPC workflows
        default: run-secure
        type: choice
        options: [run-secure, run-remote]
      region:
        description: DigitalOcean region, or auto to select an available region
        default: auto
        required: true
        type: string
      size:
        description: Plan per peer, or auto for four dedicated vCPUs (two peers, ceiling $1/hour total)
        default: auto
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    name: Compile optimized benchmark bundle
    # Same userspace as the droplet; avoid newer glibc requirements in artifacts.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CXX: clang++
      CC: clang
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actionlint 1.7.12 requires the checked-out local action syntax.
      - uses: ./.github/actions/auditable-setup # zizmor: ignore[self-repository]
        with:
          cache-key: dedicated-benchmarks
          workspaces: |
            . -> target
            benchmarks/rpc -> target
            benchmarks/rpc-upstream -> target
            benchmarks/instructions -> target
      - name: Build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cmake ninja-build clang capnproto libcapnp-dev protobuf-compiler time iproute2 libssl-dev openssl
          rustup toolchain install 1.97.0 --profile minimal
          cargo install gungraun-runner --version 0.20.0 --locked
          git submodule update --init --depth 1 -- vendor/capnproto
      - name: Compile individual release benchmarks without running them
        run: cargo run --locked -p capntproto-quality -- benchmark-build target/benchmark-build
      - name: Test droplet packaging, orchestration and cleanup
        run: |
          cargo test --locked -p capntproto-dev --lib cloud::
      - name: Test benchmark identity, validation, and CPU placement
        run: cargo nextest run --locked --manifest-path benchmarks/rpc/Cargo.toml
      - name: Test latency means and spread calculations
        run: python3 -m unittest discover -s benchmarks/rpc -p 'test_*.py'
      - name: Exercise all six workflow implementations locally (not timing evidence)
        run: cargo run --locked -p capntproto-dev -- digitalocean-bench smoke --bundle target/benchmark-build/bundle --output "$RUNNER_TEMP/benchmark-workflow-smoke" --state "$RUNNER_TEMP/workflow-smoke"
      - name: Exercise TLS and QUIC fixtures and certificate rejection (not timing evidence)
        run: |
          python3 benchmarks/rpc/secure-check.py \
            --rust target/benchmark-build/bundle/driver \
            --cpp target/benchmark-build/bundle/capnp-reference \
            --upstream target/benchmark-build/bundle/capnp-rust \
            --output "$RUNNER_TEMP/benchmark-topology-smoke"
      - name: Archive executable bundle with permissions intact
        run: tar -czf "$RUNNER_TEMP/benchmark-bundle.tar.gz" -C target/benchmark-build bundle
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: benchmark-bundle
          overwrite: true
          path: ${{ runner.temp }}/benchmark-bundle.tar.gz
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: benchmark-build-provenance
          overwrite: true
          path: |
            target/benchmark-build/evidence.json
            target/benchmark-build/logs/
            target/benchmark-build/bundle/manifest.json
            ${{ runner.temp }}/benchmark-workflow-smoke/
            ${{ runner.temp }}/benchmark-topology-smoke/
          if-no-files-found: error
          retention-days: 30
      - name: Explain benchmark scope
        run: printf 'Release compilation and workflow smoke checks completed. Trusted runs next measure two dedicated VPC peers. Fork and Dependabot PRs stop after local validation; no remote latency result is claimed for them.\n' >> "$GITHUB_STEP_SUMMARY"
  benchmark:
    name: Measure two-peer workflows, validate, and clean up
    needs: build
    # 49699333 is Dependabot's immutable GitHub actor ID.
    if: >-
      github.actor_id != '49699333' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    environment: Benchmarking
    concurrency:
      group: dedicated-benchmarks
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/auditable-setup # zizmor: ignore[self-repository]
        with:
          cache-key: dedicated-measurement
      - name: Install report validation prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y capnproto libcapnp-dev
      - name: Restore pinned sources for bundle identity validation
        run: git submodule update --init --depth 1 -- vendor/capnproto
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: benchmark-bundle
          path: ${{ runner.temp }}/benchmark-bundle
      - name: Restore this run's release bundle
        run: |
          mkdir -p target/benchmark-build
          tar -xzf "$RUNNER_TEMP/benchmark-bundle/benchmark-bundle.tar.gz" -C target/benchmark-build
      - name: Require configured Actions secret and check dedicated capacity
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          DO_REGION: ${{ inputs.region || 'auto' }}
          DO_SIZE: ${{ inputs.size || 'auto' }}
        run: |
          test -n "$DIGITALOCEAN_ACCESS_TOKEN"
          cargo run --locked -p capntproto-dev -- digitalocean-bench check --output "$RUNNER_TEMP/benchmark-quality/benchmark" --state "$RUNNER_TEMP/capntproto-do"
      - name: Run encrypted benchmarks on dedicated droplets
        id: measure
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          DO_REGION: ${{ inputs.region || 'auto' }}
          DO_SIZE: ${{ inputs.size || 'auto' }}
          BENCHMARK_CAMPAIGN: ${{ inputs.campaign || 'run-secure' }}
        run: cargo run --locked -p capntproto-dev -- digitalocean-bench "$BENCHMARK_CAMPAIGN" --trace-io --bundle target/benchmark-build/bundle --output "$RUNNER_TEMP/benchmark-quality/benchmark" --state "$RUNNER_TEMP/capntproto-do"
      - name: Extract dedicated encrypted evidence
        if: always()
        run: |
          archive="$RUNNER_TEMP/benchmark-quality/benchmark/secure/secure.tar.gz"
          if test -f "$archive"; then
            tar -xzf "$archive" -C "$RUNNER_TEMP/benchmark-quality/benchmark/secure"
          fi
      - name: Always verify cleanup of both droplets and SSH keys
        if: always()
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: cargo run --locked -p capntproto-dev -- digitalocean-bench cleanup --state "$RUNNER_TEMP/capntproto-do"
      - name: Validate downloaded samples
        if: ${{ !cancelled() && steps.measure.outcome == 'success' && inputs.campaign == 'run-remote' }}
        run: |
          cargo run --locked -p capntproto-quality -- benchmark "$RUNNER_TEMP/benchmark-quality/benchmark" target/benchmark-build/bundle
      - name: Generate validated README and comparison bar charts
        if: ${{ !cancelled() && steps.measure.outcome == 'success' && inputs.campaign == 'run-remote' }}
        run: cargo run --locked -p capntproto-quality -- report "$RUNNER_TEMP/benchmark-quality" benchmark
      - name: Export compact README data (including failed test runs)
        if: success() || failure()
        run: cargo run --locked -p capntproto-dev -- reports collect --input "$RUNNER_TEMP/benchmark-quality" --kind benchmark --output target/readme-data/publication.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: readme-data-benchmark-${{ github.run_attempt }}
          path: target/readme-data/publication.json
          if-no-files-found: warn
          retention-days: 90
      - id: report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: dedicated-benchmark-report
          overwrite: true
          path: ${{ runner.temp }}/benchmark-quality/
          if-no-files-found: error
          retention-days: 30
      - name: Job summary
        if: always()
        env:
          REPORT_URL: ${{ steps.report.outputs.artifact-url }}
        run: |
          if test -f "$RUNNER_TEMP/benchmark-quality/README.md"; then
            sed '/^## Comparison bar charts/,$d' "$RUNNER_TEMP/benchmark-quality/README.md" >> "$GITHUB_STEP_SUMMARY"
            printf '\n## Comparison bar charts\n\n[Download the README, SVG chart suite and plotted values](%s).\n' "$REPORT_URL" >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -f "$RUNNER_TEMP/benchmark-quality/benchmark/remote/README.md"; then
            sed '/^!\[Remote workflow/d' "$RUNNER_TEMP/benchmark-quality/benchmark/remote/README.md" >> "$GITHUB_STEP_SUMMARY"
            printf '\n[Download remote raw samples, host evidence and workflow graph](%s).\n' "$REPORT_URL" >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -f "$RUNNER_TEMP/benchmark-quality/benchmark/secure/secure/native/README.md"; then
            cat "$RUNNER_TEMP/benchmark-quality/benchmark/secure/secure/native/README.md" >> "$GITHUB_STEP_SUMMARY"
            printf '\n[Download dedicated TLS/QUIC samples, traces and profiles](%s).\n' "$REPORT_URL" >> "$GITHUB_STEP_SUMMARY"
          fi
