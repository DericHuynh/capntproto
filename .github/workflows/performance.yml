name: Performance / Legacy Tokio
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    name: Profile legacy Tokio rustls
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CAPNTPROTO_VALGRIND_INCLUDE: /usr/include
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/auditable-setup # zizmor: ignore[self-repository]
        with:
          cache-key: legacy-tokio-profiles
          workspaces: |
            . -> target
            benchmarks/runtimes -> target
      - name: Install instruction profiler
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y valgrind
      - name: Build the only RPC benchmark implementation
        env:
          CARGO_TARGET_DIR: target
        run: |
          cargo build --locked --release --manifest-path benchmarks/runtimes/Cargo.toml
          cargo build --locked --release -p capntproto-dev --bin runtime-runner
      - name: Generate explicit test trust
        run: target/release/runtime-bench --init-certificates target/legacy-certificates
      - name: Profile eight fixtures five times
        run: |
          target/release/runtime-runner --profile \
            --worker target/release/runtime-bench \
            --certificates target/legacy-certificates --output target/legacy-profiles
          cat target/legacy-profiles/README.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: legacy-tokio-profiles
          path: target/legacy-profiles/
          if-no-files-found: error
          retention-days: 30
