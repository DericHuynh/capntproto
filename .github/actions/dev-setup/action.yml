name: Rust development tools
description: Build locked Rust development commands without native transport dependencies.
inputs:
  cache-key:
    description: Isolate dependency artifacts by workflow
    required: true
runs:
  using: composite
  steps:
    - name: Install pinned Rust
      shell: bash
      run: rustup toolchain install 1.97.0 --profile minimal --component rustfmt,clippy
    - name: Restore Rust dependency cache
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      with:
        key: dev-${{ inputs.cache-key }}
        workspaces: . -> target
        save-if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    - name: Install pinned nextest
      uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
      with:
        tool: nextest@0.9.146
    - name: Build development commands
      shell: bash
      run: cargo build --locked -p capntproto-dev
