name: Rust dependencies and auditable Cargo
description: Restore Rust dependencies, pin cargo-auditable, and activate the Cargo wrapper.
inputs:
  cache-key:
    description: Isolate this build configuration from other CI jobs
    default: rust
  workspaces:
    description: Cargo workspace roots and target directories relative to each root
    default: . -> target
  cache-targets:
    description: Cache dependency build artifacts in addition to the registry
    default: 'true'
runs:
  using: composite
  steps:
    - name: Install pinned Rust
      shell: bash
      run: |
        rustup toolchain install 1.97.0 --profile minimal
    - name: Restore Rust dependency cache
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      with:
        key: ${{ inputs.cache-key }}
        workspaces: ${{ inputs.workspaces }}
        cache-targets: ${{ inputs.cache-targets }}
        save-if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    - name: Install auditable Cargo and metadata reader
      shell: bash
      run: |
        bash scripts/setup-auditable.sh
    - name: Activate the installed Cargo wrapper
      shell: bash
      # Intentional PATH replacement; both fixed paths contain tools installed
      # above from pinned crates or the checked-out source, never tool output.
      run: | # zizmor: ignore[github-env]
        echo "$GITHUB_WORKSPACE/target/auditable-tools/wrapper" >> "$GITHUB_PATH"
        echo "$GITHUB_WORKSPACE/target/auditable-tools/bin" >> "$GITHUB_PATH"
