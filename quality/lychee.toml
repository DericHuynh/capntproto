max_concurrency = 8
timeout = 20
max_retries = 2
include_mail = false
# Downloaded C++ sources and generated artifacts may be absent from a clean
# checkout. Historical logs now point to their archive policy. Do not exclude
# ordinary source/docs links or the frozen reports under research/reports/.
exclude = [
  '^file://.*/vendor/capnproto/',
  '^file://.*/target/',
  '^file://.*/dist/',
]

# Template links target the generated repository-root README; check that output.
exclude_path = ["docs/README.template.md"]
