\* @module: CapnpRpc
SPECIFICATION CleanupSpec
CONSTANTS
    NumVats = 2
    NumIds = 1
    MaxCalls = 1
    Callers = {1}
    AllowDisconnect = TRUE
    Bug = "none"
    Modes = {"ordinary", "bootstrap", "noPipeline", "noFinish", "pipelineOnly", "pipelineCompat", "workaround"}
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    ProtocolSafety
    NoPrematureReuse
    QuestionLifetime
    AnswerLifetime
    ReturnAgreement
    CancellationJustified
    AtMostOnceDelivery
    PipelineSoundness
    InterestedChildPreserved
    EOrder
    DisconnectClean
PROPERTIES
    EveryCallSettles
    EventuallyQuiescent
