[package]
name = "capntproto"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Capntproto: Rust schemas, capability RPC, encrypted transport and durable storage"
readme = "README.md"
rust-version = "1.97"
publish = false
build = "build.rs"

[workspace]
resolver = "2"
# Maintained Rust implementations are first-party workspace members.
members = ["test-support", "quality", "crates/*"]
# These packages retain independent toolchains, lockfiles, or benchmark builds.
exclude = [
    "vendor/capnproto",
    "benchmarks/rpc",
    "benchmarks/storage",
    "benchmarks/instructions",
    "benchmarks/concurrency",
    "examples/downstream",
    "fuzz",
    "verification/miri",
]

[features]
default = ["quic-quiche", "services", "storage"]
native = ["tls", "dep:rcgen", "dep:x509-parser", "dep:boring", "dep:quiche", "dep:zeroize", "dep:capnpc", "dep:capntproto-compiler", "dep:nix"]
services = ["dep:capnpc", "dep:capntproto-compiler"]
storage = ["dep:memmap2", "dep:fs2", "dep:capnpc", "dep:capntproto-compiler"]
tls = ["dep:rustls", "dep:tokio-rustls"]
quic = ["native"]
quic-quiche = ["quic"]

[dependencies]
boring = { version = "5", optional = true }
x509-parser = { version = "0.18", optional = true }
rcgen = { version = "0.14", optional = true, default-features = false, features = ["crypto", "ring"] }
quiche = { version = "=0.30.0", optional = true, default-features = false, features = ["boringssl-boring-crate", "custom-client-dcid"] }
capnp = { package = "capntproto-core", version = "0.25", path = "crates/capntproto-core" }
capnp-rpc = { package = "capntproto-rpc", version = "0.25.1", path = "crates/capntproto-rpc" }
capnp-futures = { package = "capntproto-futures", version = "0.25", path = "crates/capntproto-futures" }
futures = "0.3"
tokio = { version = "1", features = ["rt", "macros", "net", "time", "io-util", "sync"] }
tokio-util = { version = "0.7", features = ["compat"] }
socket2 = "0.6"
rustls = { version = "0.23.40", optional = true, default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26.4", optional = true, default-features = false, features = ["ring"] }
ring = "0.17"
memmap2 = { version = "0.9", optional = true }
fs2 = { version = "0.4", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = { version = "1", optional = true }
tempfile = "3"

[build-dependencies]
capnpc = { package = "capntproto-codegen", version = "0.25", path = "crates/capntproto-codegen", optional = true }
capntproto-compiler = { path = "crates/capntproto-compiler", optional = true }
capnp = { package = "capntproto-core", version = "0.25", path = "crates/capntproto-core" }

[dev-dependencies]
allocation-counter = "=0.8.1"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["test-util"] }
capntproto-test-support = { path = "test-support" }
capntproto-compiler = { path = "crates/capntproto-compiler" }
capnpc = { package = "capntproto-codegen", version = "0.25", path = "crates/capntproto-codegen" }

[[bin]]
name = "capntproto-model"
path = "src/bin/model.rs"

[[example]]
name = "storage_probe"
required-features = ["storage"]

[[example]]
name = "storage_resilience"
required-features = ["storage"]

[[example]]
name = "async_storage"
required-features = ["storage"]

[[example]]
name = "component_store"
required-features = ["storage"]

[[example]]
name = "quic-interop"
path = "tests/interop/quic_peer.rs"
required-features = ["quic"]


[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31", optional = true, default-features = false, features = ["net", "uio"] }
