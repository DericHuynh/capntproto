[package]
name = "reproto"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Capn't Proto: Rust schemas, capability RPC, encrypted transport and durable storage"
readme = "README.md"
rust-version = "1.97"
publish = false
build = "build.rs"

[workspace]
resolver = "2"
# capnp-rpc was already an implicit path-dependency member. Name it explicitly
# so the workspace test boundary is visible and remains stable.
members = ["test-support", "quality", "vendor/capnp-rpc", "crates/capnp-compiler", "crates/capnp-compat"]
# These packages retain independent toolchains, lockfiles, or benchmark builds.
exclude = [
    "vendor/quiche",
    "vendor/quiche/*",
    "vendor/capnproto",
    "vendor/capnp",
    "vendor/capnpc",
    "vendor/capnp-futures",
    "benchmarks/rpc",
    "benchmarks/storage",
    "benchmarks/instructions",
    "benchmarks/concurrency",
    "examples/downstream",
    "fuzz",
    "verification/miri",
]

[features]
default = ["quic-quiche", "services", "storage"]
native = ["tls", "dep:rcgen", "dep:x509-parser", "dep:boring", "dep:quiche", "dep:zeroize", "dep:capnpc", "dep:capnp-compiler"]
services = ["dep:capnpc", "dep:capnp-compiler"]
storage = ["dep:memmap2", "dep:fs2", "dep:capnpc", "dep:capnp-compiler"]
tls = ["dep:rustls", "dep:tokio-rustls"]
quic = ["native"]
quic-quiche = ["quic"]

[dependencies]
boring = { version = "5", optional = true }
x509-parser = { version = "0.18", optional = true }
rcgen = { version = "0.14", optional = true, default-features = false, features = ["crypto", "ring"] }
quiche = { version = "0.29.3", optional = true, path = "vendor/quiche/quiche", default-features = false, features = ["authenticated", "boringssl-boring-crate", "custom-client-dcid", "tokio-clock"] }
capnp = { version = "0.25", path = "vendor/capnp" }
capnp-rpc = { version = "0.25.1", path = "vendor/capnp-rpc" }
capnp-futures = { version = "0.25", path = "vendor/capnp-futures" }
futures = "0.3"
tokio = { version = "1", features = ["rt", "macros", "net", "time", "io-util", "sync"] }
tokio-util = { version = "0.7", features = ["compat"] }
socket2 = "0.6"
rustls = { version = "0.23.40", optional = true, default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26.4", optional = true, default-features = false, features = ["ring"] }
ring = "0.17"
memmap2 = { version = "0.9", optional = true }
fs2 = { version = "0.4", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = { version = "1", optional = true }
tempfile = "3"

[build-dependencies]
capnpc = { version = "0.25", path = "vendor/capnpc", optional = true }
capnp-compiler = { path = "crates/capnp-compiler", optional = true }
capnp = { version = "0.25", path = "vendor/capnp" }

[dev-dependencies]
allocation-counter = "=0.8.1"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["test-util"] }
reproto-test-support = { path = "test-support" }
capnp-compiler = { path = "crates/capnp-compiler" }
capnpc = { version = "0.25", path = "vendor/capnpc" }

[[bin]]
name = "reproto-model"
path = "src/bin/model.rs"

[[example]]
name = "storage_probe"
required-features = ["storage"]

[[example]]
name = "storage_resilience"
required-features = ["storage"]

[[example]]
name = "async_storage"
required-features = ["storage"]

[[example]]
name = "component_store"
required-features = ["storage"]

[[example]]
name = "quic-interop"
path = "tests/interop/quic_peer.rs"
required-features = ["quic"]


[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2"
