[package]
name = "capnp-rust-bench"
version = "0.1.0"
edition = "2021"
publish = false

# Deliberately independent: no workspace dependencies or patches to our fork.
[workspace]

[[bin]]
name = "capnp-rust"
path = "src/main.rs"

[dependencies]
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"] }
capnp = "=0.27.2"
capnp-rpc = "=0.27.0"
futures = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "time", "io-util"] }
tokio-util = { version = "0.7", features = ["compat"] }

[build-dependencies]
capnpc = "=0.27.0"

[profile.release]
debug = 1
overflow-checks = true
