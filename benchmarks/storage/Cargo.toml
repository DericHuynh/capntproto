[package]
name = "capntproto-storage-comparison"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
capntproto = { path = "../..", default-features = false, features = ["storage"] }
eae_pages = { path = "../../target/eae-benchmark/eae-research/rust" }
serde_json = "1"
tempfile = "3"
capnp = { package = "capntproto-core", path = "../../crates/capntproto-core" }

[build-dependencies]
capnpc = { package = "capntproto-codegen", path = "../../crates/capntproto-codegen" }

[profile.release]
debug = 1
