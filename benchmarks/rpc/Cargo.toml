[package]
name = "capntproto-rpc-bench"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
capntproto = { path = "../..", default-features = false, features = ["native"] }
capnp = { package = "capntproto-core", path = "../../crates/capntproto-core" }
capnp-rpc = { package = "capntproto-rpc", path = "../../crates/capntproto-rpc" }
futures = "0.3"
tokio = { version = "1", features = ["rt", "macros", "net", "time", "io-util", "sync"] }
tokio-util = { version = "0.7", features = ["compat"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "=0.14.6"
tonic-prost = "=0.14.6"
prost = "0.14"
tokio-tungstenite = "=0.29.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
capnpc = { package = "capntproto-codegen", path = "../../crates/capntproto-codegen" }
tonic-prost-build = "=0.14.6"

[profile.release]
debug = 1
overflow-checks = true


[[bench]]
name = "native"
harness = false

[[bench]]
name = "grpc"
harness = false

[[bench]]
name = "websocket"
harness = false

[[bench]]
name = "capnp_cpp"
harness = false
