syntax = "proto3";
package echo;
message Frame { uint64 sequence = 1; bytes payload = 2; }
service Echo { rpc Echo(Frame) returns (Frame); }

// Application RPC for the comparison protocols. IDs model state references;
// they do not provide Cap'n Proto capability security or promise pipelining.
message Operation {
  enum Kind {
    ECHO = 0;
    OPEN = 1;
    READ = 2;
    WRITE = 3;
    RELEASE = 4;
    CALLBACK = 5;
    NOTIFY = 6;
    ACK = 7;
    DONE = 8;
  }
  Kind kind = 1;
  uint64 sequence = 2;
  bytes payload = 3;
  uint64 cell = 4;
  uint64 version = 5;
  bool ephemeral = 6;
}
service Workflows {
  rpc Echo(Operation) returns (Operation);
  rpc Open(Operation) returns (Operation);
  rpc Read(Operation) returns (Operation);
  rpc Write(Operation) returns (Operation);
  rpc Release(Operation) returns (Operation);
  rpc Callback(stream Operation) returns (stream Operation);
}

// The same recursive request and reply traversed at every Cap'n Proto service hop.
message AccessNode {
  uint64 value = 1;
  bytes payload = 2;
  AccessNode next = 3;
}
message DescribeRequest {}
message Description { uint32 hops = 1; }
message AccessRequest {
  uint64 sequence = 1;
  uint32 depth = 2;
  AccessNode root = 3;
}
message AccessResponse {
  uint64 checksum = 1;
  uint32 visits = 2;
  AccessNode root = 3;
}
service AccessService {
  rpc Describe(DescribeRequest) returns (Description);
  rpc Access(AccessRequest) returns (AccessResponse);
}

// WebSocket application RPC: correlation IDs allow responses to finish out of order.
message AccessEnvelope {
  uint64 id = 1;
  oneof body {
    DescribeRequest describe = 2;
    Description description = 3;
    AccessRequest access = 4;
    AccessResponse result = 5;
    string error = 6;
  }
}
