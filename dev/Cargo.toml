[package]
name = "capntproto-dev"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
publish = false

[features]
quic-interop = ["dep:s2n-quic", "dep:tokio", "dep:rcgen", "dep:rustls"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
regex = "1"
walkdir = "2"
tempfile = "3"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
roxmltree = "0.20"
base64 = "0.22"
html-escape = "0.2"
percent-encoding = "2"
ctrlc = { version = "3", features = ["termination"] }
rand = "0.9"
rust_decimal = { version = "1", default-features = false, features = ["std"] }
s2n-quic = { version = "=1.88.0", default-features = false, features = ["provider-tls-rustls", "provider-address-token-default"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "time", "io-util", "process", "macros"], optional = true }
rcgen = { version = "0.14", optional = true }
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs"], optional = true }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal", "process", "resource"] }

[lints.rust]
unsafe_code = "forbid"
