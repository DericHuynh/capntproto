[package]
include = ["src/**", "schema/**", "schemas/**", "build.rs", "README.md", "LICENSE*", "NOTICE", "CHANGELOG.md", "REPROTO.md", "tests/**"]
repository = "https://github.com/DericHuynh/capntproto"
name = "capntproto-rpc-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "MIT"
description = "Allocation-free Capntproto RPC state transitions"
publish = true

[features]
default = []
# Optional owned replies and growing capability storage. Borrowed APIs never
# allocate, including when these conveniences are enabled.
alloc = []

[dev-dependencies]
allocation-counter = "=0.8.1"

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)", "cfg(capntproto_verus)"] }

[lints.clippy]
undocumented_unsafe_blocks = "deny"
