[package]
name = "capntproto-compiler"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "MIT"
description = "Experimental Rust compiler for the Cap'n Proto schema language"
readme = "README.md"
publish = false

[dependencies]
capnp = { package = "capntproto-core", version = "0.25", path = "../capntproto-core" }
getrandom = "0.4.3"
md5 = "0.8"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "capntproto-compile"
path = "src/main.rs"
