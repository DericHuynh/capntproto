# Maintained Capntproto crate derived from capnp-rpc. See upstream provenance and LICENSE.
[package]
publish = false
edition = "2021"
name = "capntproto-rpc"
version = "0.25.1"
authors = ["David Renshaw <dwrenshaw@gmail.com>"]
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "implementation of the Cap'n Proto remote procedure call protocol"
readme = "README.md"
categories = ["network-programming"]
license = "MIT"
repository = "https://github.com/DericHuynh/capntproto"

[features]
default = ["std"]
alloc = ["capnp/alloc", "capntproto-rpc-wire/alloc", "capntproto-rpc-engine/alloc"]
std = ["alloc", "capnp/std", "capntproto-rpc-wire/std", "dep:capnp-futures", "dep:futures"]

[lib]
name = "capnp_rpc"
path = "src/lib.rs"

[dependencies.capnp]
package = "capntproto-core"
version = "0.25.0"
path = "../capntproto-core"
default-features = false

[dependencies.capntproto-rpc-engine]
path = "../capntproto-rpc-engine"
default-features = false

[dependencies.capntproto-rpc-wire]
path = "../capntproto-rpc-wire"
default-features = false

[dependencies.capnp-futures]
package = "capntproto-futures"
version = "0.25.0"
path = "../capntproto-futures"
optional = true

[dependencies.futures]
optional = true
version = "0.3.0"
features = ["std"]
default-features = false

[lints.clippy]
missing_safety_doc = "allow"
type_complexity = "allow"

[lints.rust]
unreachable_pub = "deny"

[build-dependencies]
capntproto-compiler = { version = "0.1.0", path = "../capntproto-compiler" }
capnp = { package = "capntproto-core", version = "0.25", path = "../capntproto-core" }
capnpc = { package = "capntproto-codegen", version = "0.25", path = "../capntproto-codegen" }

[dev-dependencies]
allocation-counter = "=0.8.1"
futures = { version = "0.3.0", features = ["executor"] }
