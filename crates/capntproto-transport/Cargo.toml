[package]
name = "capntproto-transport"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/DericHuynh/capntproto"
description = "Tokio TLS streams using rustls's Unbuffered API"

[dependencies]
pin-project-lite = "0.2"
futures = "0.3"
rustls-impl = { package = "capntproto-rustls", version = "=0.23.46", path = "../../vendor/rustls", default-features = false, features = ["ring", "std"] }
tokio = { version = "1.53.3", default-features = false, features = ["io-util"] }

[dev-dependencies]
allocation-counter = "=0.8.1"
