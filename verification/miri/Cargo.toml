[package]
name = "capntproto-memory-checks"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

# Keep OS/crypto dependencies and the root crate's newer MSRV out of Miri.
[workspace]

[features]
default = ["alloc"]
alloc = ["capnp/alloc"]
unaligned = ["capnp/unaligned"]

[dependencies]
capnp = { package = "capntproto-core", path = "../../crates/capntproto-core" }
capnp-rpc = { package = "capntproto-rpc", path = "../../crates/capntproto-rpc" }

[build-dependencies]
capnpc = { package = "capntproto-codegen", path = "../../crates/capntproto-codegen" }
