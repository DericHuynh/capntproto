[package]
name = "capntproto-legacy-fixed-check"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[workspace]
resolver = "2"

[features]
alloc = ["capnp/alloc", "capntproto-rpc-engine/alloc", "capntproto-rpc-wire/alloc"]

[dependencies]
capnp = { package = "capntproto-core", path = "../../crates/capntproto-core", default-features = false }
capntproto-rpc-engine = { path = "../../crates/capntproto-rpc-engine", default-features = false }
capntproto-rpc-wire = { path = "../../crates/capntproto-rpc-wire", default-features = false }

[build-dependencies]
capnp = { package = "capntproto-core", path = "../../crates/capntproto-core" }
capnpc = { package = "capntproto-codegen", path = "../../crates/capntproto-codegen" }
capntproto-compiler = { path = "../../crates/capntproto-compiler" }

[dev-dependencies]
allocation-counter = "=0.8.1"

[[bin]]
name = "legacy-fixed-link"
path = "src/main.rs"
test = false
bench = false

[profile.dev]
debug = 0
incremental = false
